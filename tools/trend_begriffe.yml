# Begriffe für das Wikipedia-Signal des Trend-Scouts (tools/trend_signale.py).
#
# Je Kategorie die Titel deutscher Wikipedia-Artikel, genau wie in der Adresse
# (Leerzeichen statt Unterstrich). Gezählt werden die Aufrufe der letzten 14 Tage
# gegenüber den 28 Tagen davor und gegenüber dem Vorjahr. Ein Begriff ohne Artikel
# wird im Lauf gemeldet und übersprungen. Artikel mit sehr wenigen Aufrufen
# (unter etwa 100 im Monat) taugen nicht als Signal.

