hinweise:
  - "Die Spalte Intervall nennt Anhaltswerte. Feste Fristen aus Wartungsverträgen, aus Bescheiden von Behörden und aus den Angaben der Hersteller gehen ihnen vor."
  - "Nicht jede Zeile passt auf jedes Objekt. Streichen Sie, was es bei Ihnen nicht gibt, und ergänzen Sie Ihre Anlagen in den leeren Zeilen."
  - "Tragen Sie in die Spalte Nächster Termin ein festes Datum ein und nicht nur den Monat. Nur so lässt sich die Einhaltung später nachweisen."
  - "Legen Sie zu jeder ausgeführten Leistung den Bericht, die Bescheinigung oder das Protokoll in der Gebäudeakte ab. Eine Leistung ohne Nachweis lässt sich später nicht belegen."
  - "Wartung, Inspektion und Instandsetzung sind verschiedene Leistungen. Die Wartung verzögert den Verschleiß, die Inspektion stellt den Zustand fest, die Instandsetzung beseitigt den Schaden."
  - "Begehen Sie Dächer, Gerüste und Leitern nicht selbst. Arbeiten auf dem Dach, an der Fassade, an Elektro-, Gas- und Trinkwasseranlagen gehören zu Fachbetrieben mit der passenden Ausrüstung."
  - "Bei Gasgeruch, freiliegenden elektrischen Leitungen, herabfallenden Fassadenteilen oder Anzeichen für eine Gefahr für die Standsicherheit sichern oder räumen Sie den Bereich und rufen Sie Netzbetreiber, Fachbetrieb oder Behörde."
  - "Nach Sturm, Starkregen, Hochwasser, Brand oder ungewöhnlich hoher Schneelast ist eine zusätzliche Überprüfung sinnvoll, unabhängig vom Kalender."
  - "Regeln Sie die Übertragung von Aufgaben an Hausmeister oder Fachbetriebe schriftlich und kontrollieren Sie die Ausführung."
  - "Der Kalender ersetzt keine Begutachtung des Einzelfalls und keine Rechtsberatung. Fragen zu Pflichten aus Mietvertrag, Verwaltervertrag oder Beschlüssen beurteilt ein Rechtsanwalt."
