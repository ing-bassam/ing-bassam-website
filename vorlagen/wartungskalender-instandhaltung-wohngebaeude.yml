titel: Wartungs- und Instandhaltungskalender für Wohngebäude
untertitel: Terminplan für Hausverwaltungen und Wohnungsunternehmen mit Intervall, Grundlage und Nachweis
kurzform: wartungskalender-instandhaltung-wohngebaeude
typ: Tabelle
stand: 2026-09-27
dateien: [xlsx, pdf]
einleitung: >-
  In diesen Kalender tragen Sie für jede Zeile ein, wann die Leistung zuletzt ausgeführt wurde
  und wann sie wieder fällig ist. Die Spalte Intervall nennt einen Anhaltswert aus Regelwerken
  und Fachliteratur, die Spalte Grundlage die Fundstelle dazu. Feste Fristen aus Wartungsverträgen,
  Bescheiden von Behörden und Angaben der Hersteller gehen den Anhaltswerten immer vor.
  Streichen Sie Zeilen, die es in Ihrem Objekt nicht gibt, und ergänzen Sie am Ende Ihre eigenen Anlagen.
kopffelder:
  - Objekt und Anschrift
  - Baujahr und letzte Modernisierung
  - Anzahl der Wohnungen
  - Eigentümer oder Gesellschaft
  - Verwaltung und Ansprechpartner
  - Hausmeister oder Dienstleister
  - Heizungsart und Energieträger
  - Aufzug vorhanden (ja oder nein)
  - Kalenderjahr
  - Plan erstellt am und von
tabelle:
  spalten:
    - Nr.
    - Bereich
    - Bauteil oder Anlage
    - Was zu prüfen oder zu tun ist
    - Intervall
    - Grundlage
    - Wer führt es aus
    - Letzte Ausführung
    - Nächster Termin
    - Befund und Bemerkung
