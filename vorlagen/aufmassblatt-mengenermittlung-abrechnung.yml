    - ["B2", "02.03.0010", "Mauerwerk Innenwand", "EG, Wand W1, Türöffnung T1", "1", "0,885", "", "2,01", "−1,78", "m²", "Abzug der Öffnung T1; ob abgezogen oder übermessen wird, regelt die vereinbarte Abrechnungsregel", "Abrechnungsplan A-EG-01, Türliste", "P"]
    - ["B3", "02.03.0010", "Summe dieser Position auf Blatt 3", "", "", "", "", "", "9,91", "m²", "Zeilen B1 und B2", "", ""]
