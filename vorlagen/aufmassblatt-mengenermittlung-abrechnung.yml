  - "Berner u. a.: Grundlagen der Baubetriebslehre 3, 3. Aufl. 2025, S. 181–186 und 249–257"
  - "Würfele/Bielefeld/Gralla: Bauobjektüberwachung, 3. Aufl. 2017, S. 139–156"
  - "Rode/Weller: AVA-Handbuch, 11. Aufl. 2025, S. 86–91"
  - "Linnemann/Kaltenborn/Bahner: Kündigungsvergütung von Bauverträgen, 2024, S. 75"
