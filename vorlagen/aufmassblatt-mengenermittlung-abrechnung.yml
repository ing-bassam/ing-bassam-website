    - ["B5", "03.02.0040", "Frostschutzmaterial liefern und einbauen", "Hof, Fläche F2", "", "", "", "", "18,450", "t", "Wiegeschein Nr. 4711, einzeln übertragen", "Wiegeschein 4711", "L"]
