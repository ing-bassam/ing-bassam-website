titel: Aufmaßblatt für Abschlags- und Schlussrechnungen
untertitel: Mengenermittlung je Position des Leistungsverzeichnisses, nachvollziehbar für die Rechnungsprüfung
kurzform: aufmassblatt-mengenermittlung-abrechnung
typ: Tabelle
stand: 2026-11-03
dateien: [xlsx, pdf]
einleitung: >-
  Auf diesem Blatt halten Sie für einen Einheitspreisvertrag fest, welche Menge Sie je Position
  des Leistungsverzeichnisses abrechnen und wie Sie darauf kommen. Jede Zeile nennt die Position,
  den Ort am Bau, die Maße, die Menge und den Beleg. So kann die Bauleitung des Auftraggebers jede
  Zahl Ihrer Abschlags- oder Schlussrechnung bis zum Maß auf der Baustelle zurückverfolgen.
kopffelder:
  - Bauvorhaben und Anschrift
  - Auftraggeber
  - Auftragnehmer
  - Gewerk, Auftrags- oder Vertragsnummer
  - "Vertragsgrundlage (BGB oder VOB/B; vereinbarte Abrechnungsregeln)"
  - Aufmaßblatt Nr. / Blatt … von …
  - Aufmaß für Abschlagsrechnung Nr. … oder Schlussrechnung
  - Leistungsstand bis Stichtag
  - "Aufmaß nach Plan (Plan-Nr. und Index) oder vor Ort"
  - Datum des Aufmaßes
  - Anwesend für den Auftraggeber
  - Anwesend für den Auftragnehmer
  - Unterschrift Auftragnehmer, Datum
  - Unterschrift Auftraggeber oder Bauleitung, Datum
tabelle:
  spalten:
    - Nr.
    - OZ im LV
    - Kurztext der Position
    - "Ort: Geschoss, Achse, Raum, Bauteil"
    - Anzahl
    - Länge m
    - Breite m
    - Höhe / Dicke m
    - Menge (+ / −)
    - Einheit
    - Rechenansatz, Abzug, Bemerkung
    - "Beleg: Plan, Skizze, Foto, Lieferschein"
    - Feststellung
  breiten: [0.8, 1.6, 3, 3, 1, 1.1, 1.1, 1.2, 1.4, 0.9, 3.4, 2.6, 1.2]
  zeilen:
