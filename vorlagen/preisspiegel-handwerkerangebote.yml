titel: Preisspiegel für Handwerkerangebote
untertitel: Angebote von bis zu drei Firmen Position für Position vergleichen – mit Rechenformeln, Bedingungen und Rückfragen
kurzform: preisspiegel-handwerkerangebote
typ: Tabelle
stand: 2026-11-17
dateien: [xlsx]
einleitung: >-
  Tragen Sie bis zu drei Angebote Position für Position nebeneinander ein. Die Tabelle rechnet
  Gesamtpreise, Summen und den Abstand zwischen den Angeboten selbst aus. Im unteren Teil halten
  Sie fest, was ein Angebot außer dem Preis unterscheidet, etwa Nebenleistungen, Fristen, Zahlungsplan
  und Gewährleistung. So können Sie Ihre Wahl gegenüber Miteigentümern, Beirat oder Geschäftsführung
  nachvollziehbar begründen. Tippen Sie nur in die Spalten Position, Menge, Einheit und Einzelpreis
  sowie in die Textzellen; die Spalten Gesamtpreis und Spanne füllen sich von selbst.
kopffelder:
  - Objekt und Anschrift
  - Gewerk und Maßnahme
  - Verglichen am und von
tabelle:
  spalten:
    - Nr.
    - Position oder Angabe
    - Menge
    - Einheit
    - Firma A, Einzelpreis netto
    - Firma A, Gesamtpreis netto
    - Firma B, Einzelpreis netto
    - Firma B, Gesamtpreis netto
    - Firma C, Einzelpreis netto
    - Firma C, Gesamtpreis netto
    - Spanne zwischen höchstem und niedrigstem Einzelpreis
    - Prüffrage und Bemerkung
  breiten: [1, 6, 1.4, 1.4, 4, 3, 4, 3, 4, 3, 2.6, 5]
