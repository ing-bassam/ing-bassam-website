hinweise:
  - "Schicken Sie allen Firmen dieselbe Leistungsbeschreibung. Nur dann stehen die Preise für dieselbe Leistung nebeneinander."
  - "Prüfen Sie zuerst, ob jedes Angebot vollständig ist, und erst danach den Preis. Ein niedriger Preis kann bedeuten, dass Nebenarbeiten wie das Gerüst fehlen."
  - "Tragen Sie je Position die Menge einmal ein. Alle Firmen rechnen dann mit derselben Menge, und Mengenunterschiede verfälschen den Vergleich nicht."
  - "Fehlt eine Position in einem Angebot, lassen Sie die Zelle leer und fragen Sie nach. Eine fehlende Position ist keine Leistung für null Euro."
  - "Rechnen Sie Bedarfs- und Alternativpositionen getrennt von der Angebotssumme. Sie sind keine feste Leistung, sondern eine mögliche Ergänzung oder eine Variante."
  - "Rechnen Sie ein Skonto nicht in die Summe ein. Es gilt nur, wenn die Zahlung in der genannten Frist erfolgt."
  - "Die Spalte Spanne zeigt, wie weit die Einzelpreise einer Position auseinanderliegen. Sie ist ein Anlass zur Rückfrage und keine Bewertung."
  - "Ein deutlich niedrigeres Angebot ist ein Grund, die Firma zu fragen, was in ihrem Preis steckt. Es ist nicht von vornherein falsch."
  - "Das Landgericht München I hielt für größere Sanierungsmaßnahmen einer Eigentümergemeinschaft regelmäßig mindestens drei Vergleichsangebote für nötig. Die Angebote müssen dabei nicht in jeder Hinsicht über ein genaues Leistungsverzeichnis vergleichbar sein."
  - "Diese Tabelle ersetzt keine Beratung im Einzelfall, keine Prüfung der Preise durch einen Sachverständigen und keine Rechtsberatung. Fragen zu Vertrag, Fristen oder Beschluss beurteilt ein Rechtsanwalt."
quellen:
  - "Vergleich der Preise je Position in einem Preisspiegel, Auffälligkeiten und Preisabstände (Belke, Vergabepraxis für Auftraggeber, 3. Aufl. 2017, S. 162; Vogt, Kalkulation von Baupreisen, 2025, S. 126 f.)"
  - "Preisspiegel als Teil der Angebotsprüfung bei der Mitwirkung an der Vergabe (Siemon/Averhaus: HOAI 2021, 7. Aufl. 2024, S. 369)"
  - "Grundposition, Alternativposition und Bedarfsposition (Berner/Kochendörfer/Schach: Grundlagen der Baubetriebslehre 1, 3. Aufl. 2020, S. 117 f.)"
  - "Preisnachlass und Skonto bei der Wertung (Belke 2017, S. 174); Voraussetzungen einer Skontovereinbarung und Festpreis (Rode/Weller: AVA-Handbuch, 11. Aufl. 2025, S. 99)"
  - "Kostenanschlag, § 632 Abs. 3 und § 649 BGB (amtlicher Text, gesetze-im-internet.de)"
  - "Vollständigkeit vor Preisvergleich, zwei bis drei Angebote (Verbraucherzentrale: Handwerker finden, So vermeiden Sie böse Überraschungen)"
  - "Vergleichsangebote bei größeren Maßnahmen von Wohnungseigentümergemeinschaften (LG München I, Endurteil vom 03.07.2025 – 36 S 1486/24 WEG, Rn. 42 bis 44)"
