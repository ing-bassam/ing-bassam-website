name: Fachartikel-Entwurf

# Wird nur von Hand gestartet: Actions -> Fachartikel-Entwurf -> Run workflow
on:
  workflow_dispatch:
    inputs:
      thema:
        description: "Thema (aus dem Notion-Themenspeicher kopieren)"
        required: true
      kategorie:
        description: "Kategorie"
        required: true
        type: choice
        options:
          - Bauphysik
          - Bauschäden
          - Gutachter & Recht
          - Baubetrieb
          - Bauherrenwissen
          - Hausverwaltung & Bestand
      format:
        description: "Format"
        required: true
        type: choice
        options:
          - Fachbeitrag
          - Ratgeber
          - Grundlagen
          - Urteilsbesprechung
          - Praxisfall
          - Checkliste
      zielgruppe:
        description: "Zielgruppe"
        required: true
        type: choice
        options:
          - Privat
          - Gewerblich
          - Hausverwaltung

jobs:
  entwurf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write        # Entwurfsdatei anlegen und Branch pushen
      pull-requests: write   # Pull Request öffnen
      id-token: write        # von der Claude-Action benötigt

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Entwurf schreiben lassen
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /fachartikel
            Thema: ${{ inputs.thema }}
            Kategorie: ${{ inputs.kategorie }}
            Format: ${{ inputs.format }}
            Zielgruppe: ${{ inputs.zielgruppe }}
          claude_args: |
            --max-turns 30
            --model claude-opus-5
