name: Vorlagen und Checklisten

# ---------------------------------------------------------------------------
# Arbeitet die Notion-Liste „Kostenlose Vorlagen & Checklisten“ ab.
#
# Ablauf:
#   1. Nächste Vorlage mit Status „Idee“ (Priorität Hoch → Mittel → Später)
#      aus Notion laden – oder eine bestimmte Seite per Link/ID.
#      Ergebnis: Auftragsdatei in $RUNNER_TEMP/vorlage/auftrag.md.
#   2. Claude Code (Skill /vorlage) recherchiert in Fachbibliothek und Web,
#      schreibt die Beschreibung vorlagen/<kurzform>.yml, baut daraus mit
#      tools/vorlage_bauen.py die Downloads (PDF, ausfüllbares PDF, Word,
#      Excel – mit Logo und Wasserzeichen) und eine kurze Begleitseite unter
#      entwuerfe/, und öffnet einen Pull Request (Branch vorlage/<kurzform>).
#   3. Notion: Status „In Arbeit“, Download-Link = Adresse der Seite.
#   4. Schlussprüfung: jede Fußnote der Begleitseite gegen den Quelltext;
#      Paragrafen in der Vorlage müssen dort belegt sein.
#   5. Kontrolle, ob der Hauptzweig unverändert blieb.
#
# Wochenplan: dienstags um 00:37 Uhr (deutsche Zeit) zwei Runden, mit
# Kontingent-Bremse wie im Fachartikel-Agenten (tools/kontingent.py). Vor der
# Auswahl prüft tools/doppelungen.py jede offene Vorlage gegen Website und
# Pull Requests; eine Doppelung bekommt in Notion den Status „Doppelung“. Der
# Pull Request bleibt bis zum Ende der Schlussprüfung ein Entwurf.
#
# Benötigte Secrets: CLAUDE_CODE_OAUTH_TOKEN, NOTION_TOKEN (Integration muss
# mit der Datenbank „Kostenlose Vorlagen & Checklisten“ verbunden sein),
# optional BIBLIOTHEK_TOKEN für die Fachbibliothek.
#
# Sicherheitsregeln wie in fachartikel.yml: Eingaben und Secrets nur über env:,
# Fremdinhalt nur mit Präfix „| “ ins Log, kein „git config“ für den Agenten,
# Actions per Commit-SHA festgelegt.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Dienstag 00:37 Uhr deutscher Zeit (krumme Minute: geplante Läufe zur vollen
    # Stunde fallen bei GitHub öfter aus). Runden: RUNDEN_GEPLANT im Job „planen“.
    - cron: "37 0 * * 2"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      runden:
        description: "Wie viele Beiträge nacheinander? Jede Runde ist ein vollständiger Durchlauf mit allen Prüfungen und verbraucht Kontingent. Scheitert eine Runde oder findet sie nichts mehr, entfallen die übrigen."
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      notion_seite:
        description: "Vorlage aus der Notion-Liste: Link der Seite oder Seiten-ID. Leer = nächste Vorlage mit Status „Idee“ nach Priorität."
        required: false
        type: string

run-name: "Vorlage: ${{ github.event_name == 'schedule' && 'Wochenplan' || inputs.notion_seite || 'nächste Vorlage aus Notion' }} · ${{ inputs.runden || '2' }} Runde(n)"

concurrency:
  group: vorlagen
  cancel-in-progress: false

env:
  NOTION_VERSION: "2025-09-03"
  NOTION_DATA_SOURCE_ID: "b2141992-3f79-4905-a9ee-785d876ad95e"   # Data Source „Kostenlose Vorlagen & Checklisten“
  NOTION_DATABASE_ID: "2fbea8b7-d9c3-4b78-ad13-561628053ec7"      # zugehörige Datenbank-ID

jobs:
  # -----------------------------------------------------------------
  # Runden planen: Die Auswahl „Runden“ wird zu einer Liste [1, 2, …], die
  # der eigentliche Job der Reihe nach abarbeitet (max-parallel: 1). Jede
  # Runde startet erst, wenn die vorige samt Prüfungen und Notion fertig ist –
  # so wählt sie automatisch das nächste offene Thema. Ist ein bestimmtes
  # Thema oder eine bestimmte Seite angegeben, gibt es nur eine Runde.
  # Geplante Läufe prüfen vorher die Kontingent-Bremse (tools/kontingent.py).
  # -----------------------------------------------------------------
  planen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read         # tools/kontingent.py auschecken
      issues: write          # abgelaufene Kontingent-Pause schließen
      pull-requests: read    # Entwürfe der Woche zählen
    outputs:
      liste: ${{ steps.plan.outputs.liste }}
      anzahl: ${{ steps.plan.outputs.anzahl }}
    steps:
      - name: Repository auschecken
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools

      - name: Kontingent prüfen (nur geplante Läufe)
        id: kontingent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/kontingent.py pruefen | tee -a "$GITHUB_OUTPUT"

      - name: Runden planen
        id: plan
        env:
          RUNDEN: ${{ inputs.runden }}
          RUNDEN_GEPLANT: "2"      # Runden je geplantem Lauf (Wochenplan)
          GEPLANT: ${{ github.event_name == 'schedule' }}
          LAUFEN: ${{ steps.kontingent.outputs.laufen }}
          FREI: ${{ steps.kontingent.outputs.frei }}
          GRUND: ${{ steps.kontingent.outputs.grund }}
          EINZELN: "${{ inputs.notion_seite }}"
        run: |
          set -euo pipefail
          if [ "$GEPLANT" = "true" ]; then
            if [ "${LAUFEN:-ja}" = "nein" ]; then
              echo "::notice title=Vorlagen::Geplanter Lauf entfällt – ${GRUND}."
              { echo "liste=[]"; echo "anzahl=0"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            N="$RUNDEN_GEPLANT"
            case "${FREI:-}" in ''|*[!0-9]*) ;; *) if [ "$FREI" -lt "$N" ]; then N="$FREI"; fi ;; esac
          else
            N="${RUNDEN:-1}"
          fi
          case "$N" in ''|*[!0-9]*) N=1 ;; esac
          if [ "$N" -lt 1 ]; then N=1; fi
          if [ "$N" -gt 5 ]; then N=5; fi
          if [ -n "$(printf '%s' "$EINZELN" | tr -d '[:space:]')" ] && [ "$N" -gt 1 ]; then
            echo "::warning title=Vorlagen::Ein bestimmtes Thema bzw. eine bestimmte Seite ist angegeben – es gibt nur eine Runde (sonst entstünde derselbe Beitrag mehrfach)."
            N=1
          fi
          echo "liste=[$(seq -s, 1 "$N")]" >> "$GITHUB_OUTPUT"
          echo "anzahl=$N" >> "$GITHUB_OUTPUT"
          echo "Geplant: $N Runde(n)."

  vorlage:
    needs: planen
    # Null Runden (Kontingent-Bremse): Job entfällt, ohne die leere Liste auszuwerten.
    if: needs.planen.outputs.anzahl != '0'
    name: "Runde ${{ matrix.runde }} von ${{ needs.planen.outputs.anzahl }}"
    strategy:
      # Nacheinander, nie gleichzeitig; ein Fehlschlag sagt die übrigen Runden ab.
      max-parallel: 1
      fail-fast: true
      matrix:
        runde: ${{ fromJSON(needs.planen.outputs.liste) }}
    runs-on: ubuntu-latest
    # Gründliche Recherche, Schreiben und Bauen bis 90 Minuten (bei einem Fehlalarm des
    # Sicherheitsfilters ein zweiter Versuch bis 90), Schlussprüfung bis 35, dazu Notion und Abschluss.
    timeout-minutes: 240

    permissions:
      contents: write
      pull-requests: write   # Pull Request öffnen, als Entwurf markieren und freigeben
      issues: write          # Kontingent-Pause als Issue (tools/kontingent.py)
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Voraussetzungen prüfen
        id: start
        env:
          CLAUDE_TOKEN_VORHANDEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          NOTION_TOKEN_VORHANDEN: ${{ secrets.NOTION_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$CLAUDE_TOKEN_VORHANDEN" != "true" ]; then
            echo "::error title=Vorlagen::Secret CLAUDE_CODE_OAUTH_TOKEN fehlt."
            exit 1
          fi
          if [ "$NOTION_TOKEN_VORHANDEN" != "true" ]; then
            echo "::error title=Vorlagen::Secret NOTION_TOKEN fehlt – die Vorlagen kommen aus Notion."
            exit 1
          fi
          echo "zeit=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Git-Identität setzen
        id: git
        env:
          STANDARDZWEIG: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          zweig="${STANDARDZWEIG:-main}"
          sha="$(git ls-remote origin "refs/heads/${zweig}" 2>/dev/null | cut -f1 | head -n 1 || true)"
          echo "zweig=${zweig}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Vorlage aus Notion laden und Auftragsdatei schreiben
      # -----------------------------------------------------------------
      - name: Vorlage aus Notion laden
        id: auftrag
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}      # Doppelungsprüfung: Pull Requests lesen
          INPUT_NOTION_SEITE: ${{ inputs.notion_seite }}
          HEUTE: ${{ github.run_started_at }}
        # Keine Ausdrücke in doppelten geschweiften Klammern in diesem Skript (21.000-Zeichen-Grenze).
        run: |
          set -euo pipefail
          AGENTDIR="${RUNNER_TEMP}/vorlage"
          ARBEIT="${RUNNER_TEMP}/vorlage-arbeit"
          rm -rf -- "$AGENTDIR" "$ARBEIT"
          mkdir -p "$AGENTDIR" "$ARBEIT"
          trap 'rm -rf -- "$ARBEIT"' EXIT
          AUFTRAG="${AGENTDIR}/auftrag.md"
          ANTWORT="${ARBEIT}/antwort.json"
          CURLFEHLER="${ARBEIT}/curl.txt"
          SEITE="${ARBEIT}/seite.json"
          BLOECKE="${ARBEIT}/bloecke.jsonl"
          VERWANDT="${ARBEIT}/verwandt.md"           # Abschnitt „Verwandte Beiträge“ für die Auftragsdatei
          BESTAND="${ARBEIT}/bestand.json"           # Website und Pull Requests, einmal gelesen
          : > "$BLOECKE"; : > "$VERWANDT"
          NOTION_TOKEN="$(printf '%s' "${NOTION_TOKEN:-}" | tr -d '[:space:]')"
          if [[ ! "$NOTION_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error title=Vorlagen::Secret NOTION_TOKEN enthält unerwartete Zeichen."
            exit 1
          fi

          ausgabe() {
            local trenner="AUSGABE_${RANDOM}${RANDOM}${RANDOM}"
            printf '%s<<%s\n%s\n%s\n' "$1" "$trenner" "$2" "$trenner" >> "$GITHUB_OUTPUT"
          }
          einzeilig() { printf '%s' "$1" | tr '\r\n\t' '   ' | sed -e 's/  */ /g' -e 's/^ //' -e 's/ $//'; }
          fremd() { sed 's/^/| /'; }
          notion_api() {
            local methode="$1" pfad="$2" body="${3:-}"
            local -a args=( -sS --max-time 60 --retry 3 --retry-delay 3 -o "$ANTWORT" -w '%{http_code}'
                            -X "$methode" -H "Notion-Version: ${NOTION_VERSION}" -H "Content-Type: application/json" )
            if [ -n "$body" ]; then args+=( --data "$body" ); fi
            : > "$ANTWORT"
            local status
            status="$(curl "${args[@]}" -K - "https://api.notion.com/v1${pfad}" 2>"$CURLFEHLER" \
                        <<< "header = \"Authorization: Bearer ${NOTION_TOKEN}\"")" || true
            printf '%s' "${status: -3}"
          }
          notion_pruefen() {
            local status="$1" kontext="$2"
            case "$status" in
              2[0-9][0-9]) if jq -e . "$ANTWORT" >/dev/null 2>&1; then return 0; fi ;;
            esac
            echo "::group::Notion-Antwort (${kontext}, HTTP ${status})"
            if [ -s "$ANTWORT" ]; then jq -r '"code: \(.code // "?")", "message: \(.message // "?")"' "$ANTWORT" 2>/dev/null | fremd || true; fi
            if [ -s "$CURLFEHLER" ]; then echo "| curl: $(head -c 500 "$CURLFEHLER" | tr '\r\n' '  ')"; fi
            echo "::endgroup::"
            echo "::error title=Vorlagen::Notion: HTTP ${status} bei „${kontext}“. Häufige Ursachen: Integration nicht mit der Datenbank „Kostenlose Vorlagen & Checklisten“ verbunden (Notion: Datenbank → ··· → Verbindungen), Token abgelaufen, Eigenschaft umbenannt."
            exit 1
          }

          eingabe="$(einzeilig "$INPUT_NOTION_SEITE")"
          if [ -n "$eingabe" ]; then
            re='([0-9a-fA-F]{32})'
            roh="${eingabe%%\?*}"
            roh="${roh//-/}"
            if [[ "$roh" =~ $re ]]; then
              seite_id="${BASH_REMATCH[1]}"
            else
              echo "::error title=Vorlagen::Eingabe enthält keine Notion-Seiten-ID (32 Hex-Zeichen): „${eingabe}“"
              exit 1
            fi
            status="$(notion_api GET "/pages/${seite_id}")"
            notion_pruefen "$status" "Seite lesen"
            cp "$ANTWORT" "$SEITE"
            eltern="$(jq -r '.parent.data_source_id // .parent.database_id // ""' "$SEITE" | tr -d '-')"
            if [ "$eltern" != "$(tr -d '-' <<< "$NOTION_DATA_SOURCE_ID")" ] && [ "$eltern" != "$(tr -d '-' <<< "$NOTION_DATABASE_ID")" ]; then
              echo "::error title=Vorlagen::Die Seite gehört nicht zur Liste „Kostenlose Vorlagen & Checklisten“."
              exit 1
            fi
          else
            abfrage='{"filter":{"and":[{"property":"Status","select":{"equals":"Idee"}},{"property":"Download-Link","url":{"is_empty":true}}]},"sorts":[{"timestamp":"created_time","direction":"ascending"}],"page_size":100}'
            status="$(notion_api POST "/data_sources/${NOTION_DATA_SOURCE_ID}/query" "$abfrage")"
            notion_pruefen "$status" "Liste abfragen"
            anzahl="$(jq -r '(.results // []) | length' "$ANTWORT")"
            if [ "$anzahl" -eq 0 ]; then
              echo "::error title=Vorlagen::Keine Vorlage mit Status „Idee“ und leerem Download-Link in der Notion-Liste."
              exit 1
            fi
            # Reihenfolge nach Priorität, dann die Doppelungsprüfung ohne KI (tools/doppelungen.py):
            # Eine Vorlage, die ein vorhandener Beitrag schon abdeckt, wird in Notion als
            # „Doppelung“ markiert, und die nächste rückt nach. Im Log nur Seiten-IDs.
            KANDIDATEN="${ARBEIT}/kandidaten.jsonl"
            jq -c '
              def rang: (.properties["Priorität"].select.name // "") as $p
                | if $p == "Hoch" then 0 elif $p == "Mittel" then 1 elif $p == "Später" then 2 else 3 end;
              .results | sort_by(rang, .created_time) | .[]' "$ANTWORT" > "$KANDIDATEN"
            rc=0
            python3 tools/doppelungen.py auswahl --kandidaten "$KANDIDATEN" --liste vorlagen \
              --seite "$SEITE" --verwandt "$VERWANDT" --bestand-datei "$BESTAND" || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "::error title=Vorlagen::Alle ${anzahl} offenen Vorlagen decken vorhandene Beiträge schon ab (in Notion als „Doppelung“ markiert). Bitte neue Vorlagen anlegen."
              exit 1
            elif [ "$rc" -ne 0 ]; then
              echo "::warning title=Vorlagen::Doppelungsprüfung nicht möglich (Rückgabewert ${rc}) – gewählt wird ohne sie, der Agent prüft selbst."
              head -n 1 "$KANDIDATEN" > "$SEITE"
            fi
            echo "Gewählt aus ${anzahl} offenen Vorlagen (Priorität Hoch → Mittel → Später, dann älteste zuerst, ohne Doppelungen)"
          fi

          notion_id="$(jq -r '.id' "$SEITE")"
          notion_url="$(einzeilig "$(jq -r '.url // ""' "$SEITE")")"
          vorlage="$(einzeilig "$(jq -r '[.properties.Vorlage.title[]?.plain_text] | join("")' "$SEITE")")"
          zweck="$(einzeilig "$(jq -r '[.properties.Zweck.rich_text[]?.plain_text] | join("")' "$SEITE")")"
          typ="$(jq -r '.properties.Typ.select.name // ""' "$SEITE")"
          kategorie="$(jq -r '.properties.Kategorie.select.name // ""' "$SEITE")"
          zielgruppe="$(jq -r '[.properties.Zielgruppe.multi_select[]?.name] | join(", ")' "$SEITE")"
          leistung="$(jq -r '[.properties.Leistung.multi_select[]?.name] | join(", ")' "$SEITE")"
          dateiformat="$(jq -r '[.properties.Dateiformat.multi_select[]?.name] | join(", ")' "$SEITE")"
          aufwand="$(jq -r '.properties.Aufwand.select.name // ""' "$SEITE")"
          prioritaet="$(jq -r '.properties["Priorität"].select.name // ""' "$SEITE")"
          notion_status="$(jq -r '.properties.Status.select.name // ""' "$SEITE")"
          if [ -z "$vorlage" ] || [ -z "$typ" ] || [ -z "$kategorie" ]; then
            echo "::error title=Vorlagen::Pflichtfeld leer (Vorlage, Typ oder Kategorie) bei Seite ${notion_id}."
            exit 1
          fi

          # Seiteninhalt (Notizen) der obersten Ebene als Klartext
          status="$(notion_api GET "/blocks/${notion_id}/children?page_size=100")"
          notion_pruefen "$status" "Seiteninhalt lesen"
          jq -c '.results[]?' "$ANTWORT" >> "$BLOECKE"
          notizen="$(jq -r '
            def txt: [(.[.type].rich_text // [])[] | .plain_text // ""] | join("");
            .type as $t
            | if $t == "heading_1" then "# " + txt elif $t == "heading_2" then "## " + txt
              elif $t == "heading_3" then "### " + txt
              elif ($t == "bulleted_list_item" or $t == "toggle") then "- " + txt
              elif $t == "numbered_list_item" then "1. " + txt
              elif $t == "to_do" then "- [ ] " + txt
              elif ($t == "paragraph" or $t == "quote" or $t == "callout") then txt
              else empty end' "$BLOECKE" 2>/dev/null || true)"
          if [ -z "$notizen" ]; then notizen="(keine)"; fi
          heute="$(TZ=Europe/Berlin date +%F)"

          # Gezielt gestartet: nicht überspringen, aber verwandte Beiträge für die Abgrenzung nennen.
          if [ -n "$eingabe" ]; then
            python3 tools/doppelungen.py verwandt --titel "$vorlage" --kernfrage "$zweck" --format Vorlage \
              --notion-id "$notion_id" --verwandt "$VERWANDT" --bestand-datei "$BESTAND" --gezielt > /dev/null 2>&1 \
              || echo "::warning title=Vorlagen::Verwandte Beiträge nicht ermittelt – der Agent prüft selbst."
          fi

          {
            printf '# Auftrag Vorlage\n'
            printf 'vorlage: %s\n'     "$vorlage"
            printf 'typ: %s\n'         "$typ"
            printf 'zweck: %s\n'       "$zweck"
            printf 'kategorie: %s\n'   "$kategorie"
            printf 'zielgruppe: %s\n'  "$zielgruppe"
            printf 'leistung: %s\n'    "$leistung"
            printf 'dateiformat: %s\n' "$dateiformat"
            printf 'aufwand: %s\n'     "$aufwand"
            printf 'prioritaet: %s\n'  "$prioritaet"
            printf 'datum: %s\n'       "$heute"
            printf 'notion_id: %s\n'   "$notion_id"
            printf 'notion_url: %s\n'  "$notion_url"
            printf 'quelle: notion\n'
            # gezielt = eine bestimmte Seite wurde angegeben; dann darf eine vorhandene Vorlage überarbeitet werden
            if [ -n "$eingabe" ]; then printf 'modus: gezielt\n'; else printf 'modus: automatisch\n'; fi
            printf '\n## Notizen aus Notion\n%s\n' "$notizen"
            cat "$VERWANDT"
          } > "$AUFTRAG"

          echo "::group::Gewählte Vorlage"
          printf '%-13s %s\n' "Vorlage:" "$vorlage" "Typ:" "$typ" "Zweck:" "${zweck:--}" "Kategorie:" "$kategorie" \
                 "Zielgruppe:" "${zielgruppe:--}" "Dateiformat:" "${dateiformat:--}" "Priorität:" "${prioritaet:--}" \
                 "Status:" "${notion_status:--}" "Notion:" "${notion_url:--}"
          echo "::endgroup::"
          {
            echo "## Vorlage – gewählter Auftrag"; echo ""
            echo "| Feld | Wert |"; echo "|---|---|"
            echo "| Vorlage | ${vorlage//|/\\|} |"; echo "| Typ | ${typ} |"; echo "| Zweck | ${zweck//|/\\|} |"
            echo "| Dateiformat | ${dateiformat:--} |"; echo "| Priorität | ${prioritaet:--} |"
            if [ -n "$notion_url" ]; then echo "| Notion | [Seite öffnen](${notion_url}) |"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          ausgabe vorlage     "$vorlage"
          ausgabe typ         "$typ"
          ausgabe notion_id   "$notion_id"
          ausgabe notion_url  "$notion_url"
          ausgabe auftrag_pfad        "$AUFTRAG"
          ausgabe auftrag_verzeichnis "$AGENTDIR"

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Seitenbauer und Vorlagenbauer vorbereiten
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          # markdown/PyYAML: Seitenbauer; reportlab/python-docx/openpyxl/Pillow: Downloads;
          # pypdf: Schlussprüfung. Alle kostenlos.
          python -m pip install --quiet 'markdown==3.7' 'PyYAML==6.0.2' 'pypdf==6.19.0' \
            'reportlab==4.4.4' 'python-docx==1.2.0' 'openpyxl==3.1.5' 'Pillow==11.3.0'

      # -----------------------------------------------------------------
      # Fachbibliothek (siehe fachartikel.yml)
      # -----------------------------------------------------------------
      - name: Fachbibliothek prüfen
        id: bib
        env:
          TOKEN_DA: ${{ secrets.BIBLIOTHEK_TOKEN != '' }}
        run: |
          echo "vorhanden=$TOKEN_DA" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_DA" != "true" ]; then
            echo "::notice title=Fachbibliothek::Secret BIBLIOTHEK_TOKEN fehlt – der Agent arbeitet ohne Fachbibliothek."
          fi

      - name: Fachbibliothek laden
        id: bibladen
        if: steps.bib.outputs.vorhanden == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ing-bassam/FachwissenAgent
          token: ${{ secrets.BIBLIOTHEK_TOKEN }}
          path: .bibliothek
          persist-credentials: false

      - name: Suchindex der Fachbibliothek bauen
        id: bibindex
        if: steps.bibladen.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/bibliothek_suchen.py .bibliothek --index
          echo "ordner=.bibliothek" >> "$GITHUB_OUTPUT"

      - name: Fachbibliothek nicht ladbar
        if: steps.bibladen.outcome == 'failure'
        run: |
          echo "::warning title=Fachbibliothek::Die Fachbibliothek konnte nicht geladen werden (Zugangsschlüssel BIBLIOTHEK_TOKEN prüfen). Der Agent arbeitet ohne Bibliothek."

      # -----------------------------------------------------------------
      # Vorlage und Begleitseite schreiben lassen
      # -----------------------------------------------------------------
      # Für einen möglichen zweiten Versuch: Stand des Arbeitsverzeichnisses
      # vor dem Agenten merken.
      - name: Stand vor dem Agenten merken
        id: vorher
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "zweig=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Vorlage erstellen lassen
        id: claude
        # Ein Fehlschlag wird unten ausgewertet (Fehlalarm → zweiter Versuch).
        continue-on-error: true
        timeout-minutes: 90
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /vorlage
            Auftragsdatei: ${{ steps.auftrag.outputs.auftrag_pfad }}
            Vorlage: ${{ steps.auftrag.outputs.vorlage }}
            Typ: ${{ steps.auftrag.outputs.typ }}
            Notion-URL: ${{ steps.auftrag.outputs.notion_url }}
            Bibliothek: ${{ steps.bibindex.outputs.ordner || 'nicht verfügbar' }}

            Lies zuerst .claude/skills/fachartikel/SKILL.md vollständig, dann die
            Auftragsdatei.
          claude_args: |
            --max-turns 200
            --model claude-opus-5-5
            --add-dir ${{ steps.auftrag.outputs.auftrag_verzeichnis }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,WebSearch,WebFetch,Bash(wc:*),Bash(ls:*),Bash(mkdir:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(python tools/artikel_generator.py:*),Bash(python tools/vorlage_bauen.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/bibliothek_suchen.py:*)"

      # Fehlalarm des Sicherheitsfilters (02.10.2026, Fachartikel Runde 3): Die
      # API bricht mit „safeguards flagged this message“ ab und empfiehlt eine
      # neue Sitzung oder ein anderes Modell. Dann folgt ein zweiter Versuch mit
      # Opus 5 – aber nur, wenn der erste noch nichts veröffentlicht hat
      # (tools/zweiter_versuch.py). Andere Fehler bekommen keinen zweiten Versuch.
      - name: Zweiter Versuch nötig?
        id: fehlalarm
        if: steps.claude.outcome == 'failure'
        env:
          VERLAUF: ${{ steps.claude.outputs.execution_file }}
          START_SHA: ${{ steps.vorher.outputs.sha }}
          START_ZWEIG: ${{ steps.vorher.outputs.zweig }}
        run: |
          set -euo pipefail
          VERLAUF="${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}"
          python tools/agent_bericht.py "$VERLAUF" --titel "Erster Versuch"
          python tools/zweiter_versuch.py "$VERLAUF"
          if grep -q "^zweiter_versuch=true" "$GITHUB_OUTPUT"; then
            # Was der erste Versuch lokal angelegt hat, verwerfen (veröffentlicht hat er nichts).
            git checkout -q -f "$START_ZWEIG" 2>/dev/null || git checkout -q -f "$START_SHA"
            git reset -q --hard "$START_SHA"
            git clean -q -fd -- entwuerfe fachwissen vorlagen
            echo "::warning title=Agent::Fehlalarm des Sicherheitsfilters im ersten Versuch – zweiter Versuch mit Opus 5."
          fi

      - name: Vorlage erstellen lassen (zweiter Versuch, Opus 5)
        id: claude2
        continue-on-error: true
        if: steps.fehlalarm.outputs.zweiter_versuch == 'true'
        timeout-minutes: 90
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /vorlage
            Auftragsdatei: ${{ steps.auftrag.outputs.auftrag_pfad }}
            Vorlage: ${{ steps.auftrag.outputs.vorlage }}
            Typ: ${{ steps.auftrag.outputs.typ }}
            Notion-URL: ${{ steps.auftrag.outputs.notion_url }}
            Bibliothek: ${{ steps.bibindex.outputs.ordner || 'nicht verfügbar' }}

            Lies zuerst .claude/skills/fachartikel/SKILL.md vollständig, dann die
            Auftragsdatei.
          claude_args: |
            --max-turns 200
            --model claude-opus-5
            --add-dir ${{ steps.auftrag.outputs.auftrag_verzeichnis }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,WebSearch,WebFetch,Bash(wc:*),Bash(ls:*),Bash(mkdir:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(python tools/artikel_generator.py:*),Bash(python tools/vorlage_bauen.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/bibliothek_suchen.py:*)"

      # Wochenlimit des Claude-Abos erreicht? Dann pausieren die geplanten Läufe
      # bis zum Neustart (Issue „Agenten pausieren bis …“, tools/kontingent.py).
      - name: Kontingent prüfen
        id: limit
        if: ${{ always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERLAUF: ${{ steps.claude2.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: python3 tools/kontingent.py erkennen "${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}" | tee -a "$GITHUB_OUTPUT"

      # ERGEBNIS-Block des Agenten (OK, DUPLIKAT …); der Grund bleibt aus dem Protokoll.
      - name: Ergebnis-Block lesen
        id: block
        if: ${{ always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != '' }}
        continue-on-error: true
        env:
          VERLAUF: ${{ steps.claude2.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: python3 tools/agent_bericht.py "${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}" --nur-ergebnis >> "$GITHUB_OUTPUT"

      # Ein Ergebnis für alle folgenden Schritte: Erfolg, wenn einer der beiden
      # Versuche erfolgreich war. Sonst scheitert die Runde hier – genau wie
      # früher am Schreibschritt selbst.
      - name: Ergebnis des Agenten
        id: agent
        if: ${{ always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != '' }}
        env:
          ERSTER: ${{ steps.claude.outcome }}
          ZWEITER: ${{ steps.claude2.outcome }}
        run: |
          if [ "$ERSTER" = "success" ] || [ "$ZWEITER" = "success" ]; then
            echo "ergebnis=success" >> "$GITHUB_OUTPUT"
            if [ "$ZWEITER" = "success" ]; then
              echo "::notice title=Agent::Der zweite Versuch mit Opus 5 war erfolgreich."
            fi
            exit 0
          fi
          echo "ergebnis=failure" >> "$GITHUB_OUTPUT"
          exit 1


      # Die Claude-Aktion zeigt im Protokoll nur Kennzahlen. Dieser Schritt macht
      # sichtbar, was der Agent gemeldet hat, welche Befehle abgelehnt wurden und
      # welche Werkzeuge Fehler hatten – sonst bleibt ein stilles Scheitern
      # („Erfolg, aber kein Pull Request“) unerklärlich. Nichts aus der
      # Auftragsdatei gelangt ins Protokoll.
      - name: Abschlussmeldung des Agenten
        if: ${{ always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != '' }}
        continue-on-error: true
        env:
          VERLAUF: ${{ steps.claude2.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: python tools/agent_bericht.py "${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}"
      # -----------------------------------------------------------------
      # Pull Request dieses Laufs bestimmen, Notion aktualisieren
      # -----------------------------------------------------------------
      - name: Pull Request bestimmen und Notion aktualisieren
        id: ziel
        if: always() && steps.auftrag.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ID: ${{ steps.auftrag.outputs.notion_id }}
          NOTION_URL: ${{ steps.auftrag.outputs.notion_url }}
          JOBSTART: ${{ steps.start.outputs.zeit }}
          AGENT: ${{ steps.agent.outputs.ergebnis || steps.claude.outcome }}
          AGENT_BLOCK: ${{ steps.block.outputs.ergebnis }}
          AGENT_GRUND: ${{ steps.block.outputs.grund }}
        run: |
          set -euo pipefail
          NOTION_TOKEN="$(printf '%s' "${NOTION_TOKEN:-}" | tr -d '[:space:]')"
          ARBEIT="${RUNNER_TEMP}/vorlage-abschluss"
          mkdir -p "$ARBEIT"
          # Nur der eigene Entwurf dieses Laufs: Format „Vorlage“ und dieselbe Notion-Seite.
          ZEILE="$(python tools/eigener_entwurf.py --seit "$JOBSTART" --format "Vorlage" --notion-id "$NOTION_ID" --ausgabe tab)"
          if [ -z "$ZEILE" ]; then
            # Doppelung, die erst der Agent erkannt hat: Notion „Doppelung“ mit seinem Grund,
            # die übrigen Runden laufen weiter. Der Grund bleibt aus dem Protokoll.
            if [ "$AGENT" = "success" ] && [ "${AGENT_BLOCK:-}" = "DUPLIKAT" ]; then
              if NOTION_TOKEN="$NOTION_TOKEN" python3 tools/doppelungen.py markieren --seite "$NOTION_ID" \
                   --grund "${AGENT_GRUND:-vom Agenten beim Abgleich mit dem Bestand erkannt}"; then
                echo "::notice title=Vorlagen::Der Agent hat eine Doppelung erkannt – die Vorlage steht in Notion jetzt auf „Doppelung“, mit Hinweis."
              else
                echo "::warning title=Vorlagen::Der Agent hat eine Doppelung erkannt, die Notion-Seite ließ sich aber nicht markieren – bitte von Hand auf „Doppelung“ setzen: ${NOTION_URL:-$NOTION_ID}"
              fi
              echo "bereit=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$AGENT" = "success" ]; then
              echo "::error title=Vorlagen::Der Agent meldete Erfolg, aber es gibt keinen Pull Request aus diesem Lauf (Branch vorlage/*). Den Grund zeigt der Schritt „Abschlussmeldung des Agenten“ (auch in der Zusammenfassung des Laufs). Notion bleibt unverändert."
              echo "bereit=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning title=Vorlagen::Kein Pull Request aus diesem Lauf (Agent: ${AGENT}). Notion bleibt unverändert."
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NR="$(cut -f1 <<< "$ZEILE")"; ZWEIG="$(cut -f2 <<< "$ZEILE")"; PR_URL="$(cut -f3 <<< "$ZEILE")"
          KURZ="${ZWEIG#vorlage/}"
          SEITEN_URL="https://ing-bassam.de/fachwissen/${KURZ}/"
          echo "Pull Request #${NR} (${ZWEIG}) – ${PR_URL}"
          echo "- Pull Request: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          # Bis zum Ende der Schlussprüfung bleibt der Pull Request ein Entwurf (Merge gesperrt).
          if [ "$(gh pr view "$NR" --json isDraft --jq '.isDraft')" != "true" ]; then
            gh pr ready "$NR" --undo > /dev/null 2>&1 \
              || echo "::warning title=Vorlagen::Pull Request #$NR ließ sich nicht als Entwurf markieren – bitte erst nach dem Prüfkommentar zusammenführen."
          fi

          git fetch -q origin "$ZWEIG"
          git checkout -q -B "$ZWEIG" "origin/$ZWEIG"
          ENTWURF="$(gh pr view "$NR" --json files --jq '[.files[].path | select(startswith("entwuerfe/") and endswith(".md") and (ascii_downcase | endswith("readme.md") | not))][0] // ""')"
          {
            echo "bereit=$([ -n "$ENTWURF" ] && [ -f "$ENTWURF" ] && echo true || echo false)"
            echo "nummer=$NR"; echo "zweig=$ZWEIG"; echo "entwurf=$ENTWURF"
            echo "arbeit=$ARBEIT"; echo "bericht=$ARBEIT/schlusspruefung.md"
          } >> "$GITHUB_OUTPUT"

          # Notion: Status „In Arbeit“ und Adresse der späteren Seite. Bei gescheitertem Agenten
          # nur die Adresse (der Entwurf kann unvollständig sein).
          body="$(jq -n -c --arg url "$SEITEN_URL" --arg datum "$(TZ=Europe/Berlin date +%F)" --argjson ok "$([ "$AGENT" = success ] && echo true || echo false)" '
            { properties: ({ "Download-Link": { url: $url } }
              + (if $ok then { "Status": { select: { name: "In Arbeit" } }, "Stand": { date: { start: $datum } } } else {} end)) }')"
          status="$(curl -sS --max-time 60 --retry 3 --retry-delay 3 -o "$ARBEIT/notion.json" -w '%{http_code}' -X PATCH \
                      -H "Notion-Version: ${NOTION_VERSION}" -H "Content-Type: application/json" --data "$body" -K - \
                      "https://api.notion.com/v1/pages/${NOTION_ID}" <<< "header = \"Authorization: Bearer ${NOTION_TOKEN}\"")" || status="000"
          case "${status: -3}" in
            2[0-9][0-9]) echo "::notice title=Vorlagen::Notion aktualisiert (Status In Arbeit, Download-Link ${SEITEN_URL}). PR: ${PR_URL}" ;;
            *) echo "::error title=Vorlagen::Notion-Seite konnte nicht aktualisiert werden (HTTP ${status: -3}). Bitte von Hand: Status „In Arbeit“, Download-Link ${SEITEN_URL}. PR: ${PR_URL}" ;;
          esac

      # -----------------------------------------------------------------
      # Schlussprüfung der Begleitseite (wie in fachartikel.yml)
      # -----------------------------------------------------------------
      - name: Quellen für die Schlussprüfung laden
        id: quellen
        if: ${{ !cancelled() && steps.ziel.outputs.bereit == 'true' }}
        env:
          ENTWURF: ${{ steps.ziel.outputs.entwurf }}
          ARBEIT: ${{ steps.ziel.outputs.arbeit }}
        run: |
          set -euo pipefail
          BIB=()
          if [ -f .bibliothek/katalog.yml ]; then BIB=(--bibliothek .bibliothek); fi
          if ! AUSGABE="$(python tools/quellen_laden.py "$ENTWURF" "$ARBEIT" "${BIB[@]}")"; then
            echo "::warning title=Schlussprüfung::Quellen nicht ladbar – $(printf '%s\n' "$AUSGABE" | tail -n 1)"
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$AUSGABE"
          echo "pruefliste=$(printf '%s\n' "$AUSGABE" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "bereit=true" >> "$GITHUB_OUTPUT"

      - name: Schlussprüfung gegen die Quellen
        id: schluss
        if: ${{ !cancelled() && steps.quellen.outputs.bereit == 'true' }}
        continue-on-error: true
        timeout-minutes: 35
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /schlusspruefung
            Entwurf: ${{ steps.ziel.outputs.entwurf }}
            Prüfliste: ${{ steps.quellen.outputs.pruefliste }}
            Bericht: ${{ steps.ziel.outputs.bericht }}
            Bibliothek: ${{ steps.bibindex.outputs.ordner || 'nicht verfügbar' }}
          claude_args: |
            --max-turns 80
            --model claude-opus-5-5
            --add-dir ${{ steps.ziel.outputs.arbeit }}
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Skill,WebFetch,WebSearch,Bash(python tools/artikel_generator.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/bibliothek_suchen.py:*),Bash(python tools/vorlage_bauen.py:*),Bash(wc:*)"

      - name: Ergebnis der Schlussprüfung übernehmen
        if: ${{ !cancelled() && steps.quellen.outputs.bereit == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NR: ${{ steps.ziel.outputs.nummer }}
          ZWEIG: ${{ steps.ziel.outputs.zweig }}
          BERICHT: ${{ steps.ziel.outputs.bericht }}
          PRUEFUNG: ${{ steps.schluss.outcome }}
        run: |
          set -euo pipefail
          python tools/artikel_generator.py > /dev/null || true
          if ! git diff --quiet -- entwuerfe vorlagen fachwissen sitemap.xml; then
            git add entwuerfe vorlagen fachwissen sitemap.xml
            git commit -q -m "Schlusspruefung: Korrekturen gegen die Quellen" \
                          -m "Automatisch nach dem Erstellen geprueft. Einzelheiten im Kommentar des Pull Requests."
            git push -q origin "HEAD:$ZWEIG"
          fi
          if [ -s "$BERICHT" ]; then
            gh pr comment "$NR" --body-file "$BERICHT"
          else
            gh pr comment "$NR" --body "⚠️ Die Schlussprüfung ist nicht vollständig durchgelaufen (Ergebnis: ${PRUEFUNG}). Bitte Vorlage und Begleitseite vor dem Merge selbst prüfen."
          fi

      # Erst jetzt – nach der Schlussprüfung und ihren Korrekturen – wird der Pull
      # Request zum Zusammenführen freigegeben. GitHub benachrichtigt dabei.
      - name: Zum Mergen freigeben
        if: ${{ !cancelled() && steps.ziel.outputs.nummer != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NR: ${{ steps.ziel.outputs.nummer }}
          PRUEFUNG: ${{ steps.schluss.outcome }}
        run: |
          set -euo pipefail
          if gh pr ready "$NR" > /dev/null 2>&1; then
            case "$PRUEFUNG" in
              success) gh pr comment "$NR" --body "✅ Schlussprüfung abgeschlossen, Korrekturen sind eingearbeitet – bereit zur Freigabe. Bitte Vorlage und Begleitseite ansehen und zusammenführen (oder schließen)." ;;
              skipped|"") gh pr comment "$NR" --body "⚠️ Die Schlussprüfung konnte nicht laufen (Begleitseite oder Quellen nicht ladbar). Bitte Vorlage und Begleitseite vor dem Merge selbst prüfen." ;;
            esac
            echo "::notice title=Vorlagen::Pull Request #$NR ist bereit zur Freigabe."
          else
            gh pr comment "$NR" --body "Die Prüfungen sind fertig. Bitte oben auf „Ready for review“ klicken, dann ansehen und zusammenführen." || true
            echo "::warning title=Vorlagen::Pull Request #$NR ließ sich nicht automatisch freigeben – Hinweis im Pull Request."
          fi

      - name: Hauptzweig unverändert?
        if: always() && steps.git.outcome == 'success' && steps.git.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZWEIG: ${{ steps.git.outputs.zweig }}
          SHA_VORHER: ${{ steps.git.outputs.sha }}
        run: |
          set -euo pipefail
          sha_nachher="$(git ls-remote origin "refs/heads/${ZWEIG}" 2>/dev/null | cut -f1 | head -n 1 || true)"
          if [ -z "$sha_nachher" ] || [ "$sha_nachher" = "$SHA_VORHER" ]; then
            echo "${ZWEIG} ist unverändert."
            exit 0
          fi
          # Die direkte Commit-Kette des Hauptzweigs prüfen: Merges über GitHub und der Seitenbau
          # sind unbedenklich, ein direkter Bot-Commit (Agent) nicht (tools/hauptzweig_pruefen.py).
          python tools/hauptzweig_pruefen.py "$SHA_VORHER" "$sha_nachher" --titel Vorlagen

      # -----------------------------------------------------------------
      # Mehrere Runden: Die nächste Runde startet nur, wenn diese einen neuen
      # Entwurf hervorgebracht hat. Sonst (Liste leer, kein passender Fall,
      # Duplikat) würde sie dieselbe vergebliche Suche wiederholen und
      # Kontingent verbrauchen. Der Fehler hier sagt die übrigen Runden ab.
      # -----------------------------------------------------------------
      - name: Weitere Runden nur nach einem neuen Entwurf
        if: success() && matrix.runde < fromJSON(needs.planen.outputs.anzahl)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEGINN: ${{ steps.start.outputs.zeit }}
          RUNDE: ${{ matrix.runde }}
          ANZAHL: ${{ needs.planen.outputs.anzahl }}
          AGENT_BLOCK: ${{ steps.block.outputs.ergebnis }}
        run: |
          set -euo pipefail
          if [ -z "${BEGINN:-}" ]; then
            echo "::error title=Vorlagen::Startzeit dieser Runde unbekannt – die übrigen Runden werden sicherheitshalber abgesagt."
            exit 1
          fi
          # Eine erkannte Doppelung kostet nur wenige Züge; die Vorlage steht jetzt in Notion auf
          # „Doppelung“, die nächste Runde wählt also eine andere.
          if [ "${AGENT_BLOCK:-}" = "DUPLIKAT" ]; then
            echo "::notice title=Vorlagen::Runde ${RUNDE} von ${ANZAHL}: Doppelung erkannt – weiter mit der nächsten Vorlage."
            exit 0
          fi
          # Eigene Entwürfe dieser Runde, erkannt am Format im Dateikopf (nicht nur am Zweig):
          # So zählt ein gleichzeitig laufender anderer Agent nicht als Ergebnis dieser Runde.
          neu="$(python tools/eigener_entwurf.py --seit "$BEGINN" --format "Vorlage" --ausgabe anzahl)"
          if [ "${neu:-0}" -eq 0 ]; then
            echo "::error title=Vorlagen::Runde ${RUNDE} von ${ANZAHL} hat keinen neuen Entwurf erzeugt (nichts Passendes mehr gefunden oder Duplikat). Die übrigen Runden werden abgesagt, damit kein Kontingent verpufft."
            exit 1
          fi
          echo "::notice title=Vorlagen::Runde ${RUNDE} von ${ANZAHL} fertig – weiter mit der nächsten."
