name: Fachwissen-Seiten bauen

# -----------------------------------------------------------------------------
# Baut aus den Markdown-Entwürfen in entwuerfe/ die statischen Artikelseiten
# unter fachwissen/ und schreibt die sitemap.xml neu.
#
# Warum automatisch: KI-Crawler führen kein JavaScript aus. Der Artikeltext muss
# deshalb im ausgelieferten HTML stehen, und jeder Beitrag braucht eine eigene
# URL, auf die ein Zitat zeigen kann.
#
# Wann der Lauf startet:
#   - wenn der Fachartikel-Agent einen Entwurf auf einen entwurf/*-Zweig schiebt
#     (die Seite landet dann im selben Pull Request wie der Entwurf),
#   - wenn im Pull Request am Entwurf nachgebessert wird,
#   - wenn der Entwurf nach dem Mergen auf main liegt,
#   - wenn im Entwurf „status: Veröffentlicht" gesetzt wird,
#   - von Hand über Actions -> Fachwissen-Seiten bauen -> Run workflow.
#
# Kein Kreislauf: Der Lauf schreibt ausschließlich nach fachwissen/ und in
# sitemap.xml. Beides steht nicht in der paths-Liste unten, der eigene Commit
# löst also keinen neuen Lauf aus. Zusätzlich lösen Commits mit dem
# GITHUB_TOKEN grundsätzlich keine weiteren Workflows aus.
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - main
      - 'entwurf/**'
      - 'vorlage/**'
    paths:
      - 'entwuerfe/**'
      # Download-Dateien der Vorlagen: Größe und Liste im Download-Kasten
      - 'vorlagen/**'
      - 'tools/artikel_generator.py'
      - 'fachwissen/artikel.css'
      - '.github/workflows/seiten-bauen.yml'
  workflow_dispatch:

# Läuft je Zweig nur einmal gleichzeitig. Schiebt der Agent zwei Commits kurz
# hintereinander, gewinnt der neuere Lauf.
concurrency:
  group: seiten-bauen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    # Seitenbau braucht wenige Minuten; bis zu 15 kommen für IndexNow dazu,
    # das wartet, bis GitHub Pages den neuen Stand ausliefert.
    timeout-minutes: 25

    permissions:
      contents: write        # erzeugte Seiten zurückschreiben

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ohne persist-credentials würde der spätere Push die Anmeldung
          # nicht finden.
          persist-credentials: true

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          # markdown wandelt den Entwurf in HTML (inkl. Fußnoten und Tabellen),
          # PyYAML liest das Frontmatter.
          python -m pip install --quiet 'markdown==3.7' 'PyYAML==6.0.2'

      - name: Seiten bauen
        id: bauen
        run: |
          set -uo pipefail
          # Rückgabewert merken statt sofort abzubrechen: Ist ein einzelner
          # Beitrag gesperrt (etwa „Veröffentlicht“ mit offenem Prüfpunkt), bleibt
          # er auf noindex – alle anderen Seiten sollen trotzdem aktuell werden.
          # Der Lauf schlägt erst am Ende fehl, damit die Warnung erhalten bleibt.
          python tools/artikel_generator.py 2>&1 | tee "$RUNNER_TEMP/generator.log"
          RUECKGABE=${PIPESTATUS[0]}
          echo "rueckgabe=$RUECKGABE" >> "$GITHUB_OUTPUT"
          if [ "$RUECKGABE" -ne 0 ] && [ "$RUECKGABE" -ne 2 ]; then
            echo "::error title=Fachwissen::Der Generator ist unerwartet abgebrochen (Rückgabewert $RUECKGABE)."
            exit "$RUECKGABE"
          fi
          {
            echo '## Fachwissen-Seiten'
            echo
            echo '```'
            cat "$RUNNER_TEMP/generator.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Änderungen zurückschreiben
        id: commit
        env:
          ZWEIG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- fachwissen sitemap.xml)" ]; then
            echo "::notice title=Fachwissen::Die erzeugten Seiten sind bereits aktuell."
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bewusst nur diese beiden Pfade: Der Lauf fasst weder Entwürfe noch
          # index.html, robots.txt oder CNAME an.
          git add -A fachwissen sitemap.xml
          git commit -m "Fachwissen-Seiten neu gebaut" \
                     -m "Automatisch erzeugt aus entwuerfe/ durch tools/artikel_generator.py."

          # Zwischenzeitliche Commits auf dem Zweig nicht überschreiben.
          git pull --rebase --autostash origin "$ZWEIG"
          git push origin "HEAD:$ZWEIG"

          echo "geaendert=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Fachwissen::Erzeugte Seiten aktualisiert und auf $ZWEIG geschoben."

      - name: Ergebnis prüfen
        if: steps.commit.outputs.geaendert == 'true'
        run: |
          set -euo pipefail
          # Nach dem Schreiben darf ein zweiter Lauf nichts mehr ändern. Tut er
          # es doch, ist der Generator nicht reproduzierbar – das würde bei
          # jedem Lauf einen neuen Commit erzeugen.
          # Zweiter Lauf und Vergleich über git statt über den Rückgabewert: Der
          # ist bei einem gesperrten Beitrag immer 2 und sagte hier nichts aus.
          python tools/artikel_generator.py > /dev/null 2>&1 || true
          if [ -n "$(git status --porcelain -- fachwissen sitemap.xml)" ]; then
            echo "::error title=Fachwissen::Der Generator liefert bei zwei Läufen unterschiedliche Ergebnisse."
            exit 1
          fi
          echo "::notice title=Fachwissen::Zweiter Lauf bestätigt: Ergebnis ist stabil."

      # IndexNow: Bing und die übrigen teilnehmenden Suchmaschinen erfahren
      # sofort von neuen und geänderten Seiten, statt auf ihren Crawler zu
      # warten. Gemeldet werden nur Adressen, deren Eintrag in der Sitemap neu
      # ist oder deren Stand sich geändert hat – Entwürfe stehen dort nie.
      # Nur auf main, denn nur main ist online. Ein Fehler hier färbt den
      # Seitenbau nicht rot; die wöchentliche Prüfung meldet verpasste Seiten
      # nach.
      - name: Suchmaschinen benachrichtigen (IndexNow)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 15
        env:
          VORHER: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ALT="$RUNNER_TEMP/sitemap-vorher.xml"
          : > "$ALT"
          MODUS=(--vorher "$ALT")
          if [[ "$VORHER" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$VORHER" =~ ^0+$ ]] \
             && git fetch -q --depth=1 origin "$VORHER" 2>/dev/null; then
            git show "$VORHER:sitemap.xml" > "$ALT" 2>/dev/null || true
            # Kam die Schlüsseldatei erst mit diesem Push, hat noch keine
            # Suchmaschine eine Meldung erhalten: dann einmal alle Seiten melden.
            if ! git ls-tree --name-only "$VORHER" | grep -Eq '^[0-9a-f]{32}\.txt$'; then
              MODUS=(--alle)
            fi
          fi
          python tools/indexnow.py "${MODUS[@]}"

      - name: Gesperrte Beiträge melden
        if: always() && steps.bauen.outputs.rueckgabe == '2'
        run: |
          # Die übrigen Seiten sind zu diesem Zeitpunkt bereits zurückgeschrieben.
          grep "^FEHLER:" "$RUNNER_TEMP/generator.log" | while IFS= read -r zeile; do
            echo "::error title=Beitrag gesperrt::${zeile#FEHLER: }"
          done
          exit 2
