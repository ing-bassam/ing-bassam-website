name: Entwürfe veröffentlichen

# -----------------------------------------------------------------------------
# Läuft montags bis freitags um 07:43 Uhr von selbst und stellt dann höchstens
# zwei freigegebene (zusammengeführte) Entwürfe online, die ältesten zuerst.
# Von Hand: Actions → Entwürfe veröffentlichen → Run workflow (Standard: alle).
#
#   0. Prüft alle Entwürfe ohne KI auf wörtliche Übernahmen aus der
#      Fachbibliothek (tools/wortgleich_pruefen.py; die Bibliothek wird dazu
#      aus dem privaten Repository FachwissenAgent geladen).
#   1. Setzt die gewählten Entwürfe auf „Veröffentlicht“
#      (tools/veroeffentlichen.py). Zurück bleiben – mit Grund in der
#      Zusammenfassung – Entwürfe mit offenen Prüfpunkten, mit
#      „zurueckhalten: ja“, Doppelungen (dasselbe Urteil oder Thema wie ein
#      anderer Beitrag), Entwürfe, deren Prüfkorrekturen noch nicht auf main
#      sind, und Entwürfe mit wörtlicher Übereinstimmung mit der
#      Fachbibliothek. Fail-closed: Ist diese Prüfung nicht möglich (etwa weil
#      BIBLIOTHEK_TOKEN fehlt oder abgelaufen ist), geht nichts online.
#   2. Baut die Seiten, sortiert die Dateien nach entwuerfe/veroeffentlicht/
#      und erneuert Übersicht, Sitemap und llms.txt.
#   3. Schreibt alles in einem Commit auf den Hauptzweig.
#   4. Danach liefert „Website ausliefern“ die Seiten aus und meldet sie per IndexNow.
#   5. Schreibt je Beitrag einen Stichwortzettel für die Videos (Agent, Skill
#      /stichwortzettel) in die Notion-Liste „Stichwortzettel Videos“.
#   6. Gleicht die Notion-Listen ab (tools/notion_abgleich.py): online →
#      „Veröffentlicht“ bzw. „Online“, mit Link.
#
# Warum der Workflow selbst baut und meldet: Was ein Workflow mit dem
# GITHUB_TOKEN auf den Hauptzweig schreibt, löst bei GitHub keinen weiteren
# Workflow aus – „Fachwissen-Seiten bauen“ würde also nicht anspringen, und
# die Seiten blieben gesperrt.
#
# Kosten: keine. Kontingent: keines (kein Agent).
# -----------------------------------------------------------------------------

on:
  schedule:
    # Montag bis Freitag 07:43 Uhr deutscher Zeit (krumme Minute: geplante Läufe
    # zur vollen Stunde fallen bei GitHub öfter aus).
    - cron: "43 7 * * 1-5"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      auswahl:
        description: "Welche Entwürfe? „alle“, „automatisch“ (die zwei ältesten) – oder Kurzformen durch Komma getrennt, z. B. was-kostet-ein-baugutachter, rissprotokoll-rissbeobachtung"
        required: false
        default: "alle"
        type: string
      probelauf:
        description: "Nur anzeigen, was veröffentlicht würde – nichts ändern"
        required: false
        default: false
        type: boolean

run-name: "Entwürfe veröffentlichen: ${{ inputs.auswahl || 'automatisch, höchstens 2' }}${{ inputs.probelauf && ' (Probelauf)' || '' }}"

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write        # Status, Seiten und Sitemap zurückschreiben
      pull-requests: read    # prüfen, ob Prüfkorrekturen noch auf ihrem Zweig liegen
      issues: write          # Kontingent-Pause als Issue (tools/kontingent.py)
      id-token: write        # Stichwortzettel: von der Claude-Action benötigt

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Python bereitstellen
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet 'markdown==3.7' 'PyYAML==6.0.2'

      # -----------------------------------------------------------------
      # Fachbibliothek (wie in entwurf-pruefen.yml) – hier nur für die
      # Prüfung auf wörtliche Übernahmen. Ohne Secret oder bei einem Fehler
      # bricht der Lauf nicht ab; veröffentlicht wird dann aber nichts.
      # -----------------------------------------------------------------
      - name: Fachbibliothek prüfen
        id: bib
        env:
          # Nur Ja/Nein, nie der Wert selbst.
          TOKEN_DA: ${{ secrets.BIBLIOTHEK_TOKEN != '' }}
        run: |
          echo "vorhanden=$TOKEN_DA" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_DA" != "true" ]; then
            echo "::warning title=Fachbibliothek::Secret BIBLIOTHEK_TOKEN fehlt – ohne Prüfung auf wörtliche Übernahmen wird nichts veröffentlicht."
          fi

      - name: Fachbibliothek laden
        id: bibladen
        if: steps.bib.outputs.vorhanden == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bib-ingenieurbuero/FachwissenAgent
          token: ${{ secrets.BIBLIOTHEK_TOKEN }}
          path: .bibliothek
          # Der Zugangsschlüssel bleibt nicht im Arbeitsverzeichnis liegen.
          persist-credentials: false

      - name: Fachbibliothek nicht ladbar
        if: steps.bibladen.outcome == 'failure'
        run: |
          echo "::warning title=Fachbibliothek::Die Fachbibliothek konnte nicht geladen werden. Meist ist der Zugangsschlüssel BIBLIOTHEK_TOKEN abgelaufen – bitte erneuern. Ohne Prüfung auf wörtliche Übernahmen wird nichts veröffentlicht."

      # Ohne KI: Wortfolgen der Entwürfe, die wörtlich in der Fachbibliothek stehen.
      # Das JSON nennt Datei, Abschnitt, Zeile, Werk und Seite – nie Text – und bleibt im
      # Runner-Temp: Nur tools/veroeffentlichen.py liest es (und gibt je Entwurf nur die Zahl
      # der Stellen aus); ins Protokoll kommt nur die letzte Zeile der Prüfung (treffer=…).
      - name: Wörtliche Übernahmen prüfen (ohne KI)
        id: wortgleich
        run: |
          set -uo pipefail
          # GitHub startet run-Schritte mit „bash -e“: Rückgabewert 1 (Treffer) oder 2 (nicht
          # geprüft) würde den Schritt sonst abbrechen – dann ginge auch kein sauberer Entwurf
          # online. Der Rückgabewert wird ausdrücklich ausgewertet.
          set +e
          JSON="$RUNNER_TEMP/wortgleich.json"
          rm -f "$JSON"
          shopt -s nullglob
          KANDIDATEN=(entwuerfe/entwurf/*.md)
          if [ "${#KANDIDATEN[@]}" -eq 0 ]; then
            echo "Keine Entwürfe – nichts zu prüfen."
            echo "rueckgabe=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fehlerausgabe nur ins Runner-Temp: Bei einem Absturz könnte sie Text aus der
          # Bibliothek enthalten, und dieses Protokoll ist öffentlich.
          python tools/wortgleich_pruefen.py "${KANDIDATEN[@]}" --bibliothek .bibliothek --json "$JSON" \
            > "$RUNNER_TEMP/wortgleich.txt" 2> "$RUNNER_TEMP/wortgleich.err"
          RUECKGABE=$?
          echo "Wörtliche Übernahmen: $(tail -n 1 "$RUNNER_TEMP/wortgleich.txt" 2> /dev/null) (Rückgabewert $RUECKGABE, ${#KANDIDATEN[@]} Entwürfe)"
          case "$RUECKGABE" in
            0) ;;
            1) echo "::warning title=Wörtliche Übernahmen::Mindestens ein Entwurf stimmt stellenweise wörtlich mit der Fachbibliothek überein – er bleibt zurück (Grund in der Zusammenfassung)." ;;
            *)
              # Nicht geprüft: tools/veroeffentlichen.py hält dann jeden Entwurf zurück.
              printf '{"geprueft": false, "treffer": "nicht-geprueft"}\n' > "$JSON"
              echo "::error title=Wörtliche Übernahmen::Prüfung nicht möglich (Rückgabewert $RUECKGABE, meist fehlt die Fachbibliothek) – heute wird nichts veröffentlicht."
              ;;
          esac
          echo "rueckgabe=$RUECKGABE" >> "$GITHUB_OUTPUT"

      - name: Entwürfe auf „Veröffentlicht“ setzen
        id: status
        env:
          # Geplante Läufe haben keine Eingaben: dann automatisch, höchstens zwei.
          AUSWAHL: ${{ inputs.auswahl || 'automatisch' }}
          PROBELAUF: ${{ inputs.probelauf }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORTGLEICH_RUECKGABE: ${{ steps.wortgleich.outputs.rueckgabe }}
        run: |
          set -euo pipefail
          PROBE=()
          if [ "$PROBELAUF" = "true" ]; then PROBE=(--probelauf); fi
          if [ "$AUSWAHL" = "automatisch" ]; then
            WAHL=(--automatisch --max 2)
          else
            WAHL=(--auswahl "$AUSWAHL")
          fi
          # Gegenprobe vor jeder Änderung: Meldet die Prüfung Treffer (Rückgabewert 1), muss ihr JSON
          # sie auch zählen – sonst ließ sich das Ergebnis nicht lesen, und es geht nichts online.
          # Die Zuordnung zu den Entwürfen prüft tools/veroeffentlichen.py selbst: Treffer in einem
          # nicht gewählten Entwurf halten nur diesen zurück, nicht zuzuordnende Treffer alle.
          if [ "${WORTGLEICH_RUECKGABE:-}" = "1" ] && ! python -c 'import json, sys; sys.exit(0 if (json.load(open(sys.argv[1], encoding="utf-8")).get("anzahl_treffer") or 0) > 0 else 1)' "$RUNNER_TEMP/wortgleich.json"; then
            echo "::error title=Veröffentlichen::Die Prüfung auf wörtliche Übernahmen meldet Treffer, ihr Ergebnis ist aber nicht lesbar – es wird nichts veröffentlicht."
            exit 1
          fi
          # Fail-closed: Fehlt das JSON der Prüfung, hält tools/veroeffentlichen.py jeden Entwurf zurück.
          python tools/veroeffentlichen.py "${WAHL[@]}" "${PROBE[@]}" --bericht "$RUNNER_TEMP/veroeffentlichen.json" \
            --wortgleich "$RUNNER_TEMP/wortgleich.json" | tee "$RUNNER_TEMP/veroeffentlichen.log"
          echo "anzahl=$(tail -n 1 "$RUNNER_TEMP/veroeffentlichen.log")" >> "$GITHUB_OUTPUT"
          {
            echo "## Entwürfe veröffentlichen"
            echo
            echo '```'
            head -n -1 "$RUNNER_TEMP/veroeffentlichen.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seiten bauen und einsortieren
        if: inputs.probelauf != true && steps.status.outputs.anzahl != '0'
        env:
          SEITENBAU_ORDNEN: "1"
        run: |
          set -uo pipefail
          python tools/artikel_generator.py --ordnen 2>&1 | tee "$RUNNER_TEMP/generator.log"
          RUECKGABE=${PIPESTATUS[0]}
          if [ "$RUECKGABE" -ne 0 ] && [ "$RUECKGABE" -ne 2 ]; then
            echo "::error title=Veröffentlichen::Der Seitenbau ist unerwartet abgebrochen (Rückgabewert $RUECKGABE) – es wurde nichts geschrieben."
            exit "$RUECKGABE"
          fi
          if [ "$RUECKGABE" -eq 2 ]; then
            grep "^FEHLER:" "$RUNNER_TEMP/generator.log" | while IFS= read -r zeile; do
              echo "::warning title=Beitrag gesperrt::${zeile#FEHLER: }"
            done
          fi

      - name: Auf den Hauptzweig schreiben
        if: inputs.probelauf != true && steps.status.outputs.anzahl != '0'
        env:
          ZWEIG: ${{ github.ref_name }}
          ANZAHL: ${{ steps.status.outputs.anzahl }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # en/guides: englische Leitfäden – ihre Sprachverknüpfung hängt am deutschen Original.
          git add -A entwuerfe fachwissen en/guides sitemap.xml llms.txt
          # Die erste Zeile ist fest: tools/hauptzweig_pruefen.py erkennt daran
          # einen erlaubten Bot-Commit und schlägt bei laufenden Agenten keinen Alarm.
          git commit -q -m "Entwürfe veröffentlicht" \
                        -m "$ANZAHL Beitrag/Beiträge über den Workflow „Entwürfe veröffentlichen“ freigegeben; Seiten, Sitemap und Übersicht neu gebaut."
          git pull -q --rebase --autostash origin "$ZWEIG"
          git push -q origin "HEAD:$ZWEIG"
          echo "::notice title=Veröffentlichen::$ANZAHL Beitrag/Beiträge veröffentlicht. Die Seiten sind in wenigen Minuten online."

      # Veröffentlichen und IndexNow übernimmt danach der Workflow „Website
      # ausliefern“ (workflow_run): Er meldet erst, wenn der neue Stand online ist.

      # -----------------------------------------------------------------
      # Stichwortzettel für die Videos: Zu jedem gerade veröffentlichten
      # Beitrag schreibt ein Agent (Skill /stichwortzettel) die drei stärksten
      # Kernaussagen mit Fußnote; das Ergebnis landet in der Notion-Liste
      # „Stichwortzettel Videos“. Kostet wenig Kontingent (höchstens 2 je Tag,
      # je etwa 25 Züge). Der Beitrag selbst bleibt unberührt.
      # -----------------------------------------------------------------
      - name: Beiträge für den Stichwortzettel bestimmen
        id: zettel
        if: inputs.probelauf != true && steps.status.outputs.anzahl != '0'
        run: python tools/stichwortzettel.py auftrag --bericht "$RUNNER_TEMP/veroeffentlichen.json" --ordner "$RUNNER_TEMP/stichwortzettel"

      - name: Stichwortzettel schreiben lassen
        id: zettel_agent
        if: steps.zettel.outputs.anzahl != '' && steps.zettel.outputs.anzahl != '0'
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /stichwortzettel
            ${{ steps.zettel.outputs.auftrag }}
          # Nur lesen und die Zetteldateien schreiben – kein git, kein gh, kein Web.
          claude_args: |
            --max-turns 25
            --model claude-opus-5-5
            --add-dir ${{ steps.zettel.outputs.ordner }}
            --allowedTools "Read,Write,Glob,Grep,TodoWrite,Skill"

      - name: Kontingent prüfen
        if: steps.zettel_agent.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERLAUF: ${{ steps.zettel_agent.outputs.execution_file }}
        run: python3 tools/kontingent.py erkennen "${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}"

      - name: Stichwortzettel nach Notion
        if: steps.zettel.outputs.anzahl != '' && steps.zettel.outputs.anzahl != '0'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python tools/stichwortzettel.py ablegen --bericht "$RUNNER_TEMP/veroeffentlichen.json" --ordner "$RUNNER_TEMP/stichwortzettel"

      # Notion auf den Stand der Website bringen – auch ohne neue Veröffentlichung,
      # weil inzwischen Entwürfe dazugekommen sein können. Ändert nur, was nicht stimmt.
      - name: Notion abgleichen
        if: always() && steps.status.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBELAUF: ${{ inputs.probelauf }}
        run: |
          set -euo pipefail
          PROBE=()
          if [ "$PROBELAUF" = "true" ]; then PROBE=(--probelauf); fi
          python tools/notion_abgleich.py "${PROBE[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
