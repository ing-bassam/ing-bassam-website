name: Urteilsbesprechung

# -----------------------------------------------------------------------------
# Sucht in amtlichen Rechtsprechungsdatenbanken nach einer baurelevanten
# Gerichtsentscheidung und lässt daraus eine Urteilsbesprechung schreiben.
#
# Ablauf:
#   1. tools/urteile_finden.py stellt eine vorsortierte Kandidatenliste
#      zusammen – Berlin und Brandenburg zuerst, danach der Bund. Vorgabe sind
#      Grundsatzentscheidungen, die 1 bis 15 Jahre zurückliegen: gestreut über
#      alle Jahrgänge, die gewichtigsten zuerst (Leitsatz des Gerichts, Rang des
#      Gerichts). Bei „höchstens 1 Jahr“ stehen die jüngsten zuerst.
#      Schon besprochene Aktenzeichen fallen raus.
#   2. Der Agent prüft die Kandidaten am Volltext, wählt eine aus und schreibt
#      den Entwurf nach entwuerfe/. Er baut die HTML-Seite und öffnet einen
#      Pull Request.
#   3. Faktenprüfung: Ein zweiter Agent vergleicht jede Aussage über die
#      Entscheidung mit ihrer Randnummer im Volltext.
#   4. Schlussprüfung: tools/quellen_laden.py lädt jede Fußnotenquelle herunter;
#      ein dritter Agent vergleicht jeden belegten Satz mit dem Quelltext und
#      prüft die Änderungen der Faktenprüfung noch einmal gegen den Volltext.
#   Beide Prüfungen committen ihre Korrekturen in den Pull Request und
#   berichten als Kommentar.
#
# Quellen (ausschließlich amtlich):
#   rechtsprechung-im-internet.de           Bundesamt für Justiz
#   gerichtsentscheidungen.brandenburg.de   Landesrechtsportal Brandenburg
#   nrwesuche.justiz.nrw.de                 Justiz Nordrhein-Westfalen
#   gesetze.berlin.de und neun weitere      juris-Landesportale, darunter das
#                                           Kammergericht Berlin
#
# Nicht enthalten sind Bayern, Niedersachsen, Bremen und Sachsen: Deren Portale
# liefern kein auswertbares Trefferformat.
# -----------------------------------------------------------------------------

# Wochenplan: Mittwoch um 00:37 Uhr (deutsche Zeit) eine Runde, mit
# Kontingent-Bremse (tools/kontingent.py). Schon besprochene Urteile –
# veröffentlicht, auf main oder in einem Pull Request, auch einem gerade erst
# zusammengeführten – erkennt die Suche am Aktenzeichen und an der ECLI
# (tools/urteile_finden.py über tools/bestand.py). Der Pull Request bleibt bis
# zum Ende von Fakten- und Schlussprüfung und der Prüfung auf wörtliche
# Übernahmen und Normstand (ohne KI) ein Entwurf – findet diese etwas oder ist
# sie nicht möglich, auch danach.
on:
  schedule:
    # Krumme Minute: Geplante Läufe zur vollen Stunde fallen bei GitHub öfter aus.
    - cron: "37 0 * * 3"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      runden:
        description: "Wie viele Beiträge nacheinander? Jede Runde ist ein vollständiger Durchlauf mit allen Prüfungen und verbraucht Kontingent. Scheitert eine Runde oder findet sie nichts mehr, entfallen die übrigen."
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      alter:
        description: "Wie alt dürfen die Urteile sein? Ab 1 Jahr sucht der Agent Grundsatzentscheidungen (mit Leitsatz) aus allen Jahrgängen und prüft, ob sie heute noch gelten."
        required: false
        default: "1 bis 15 Jahre"
        type: choice
        options:
          - "1 bis 15 Jahre"
          - "1 bis 10 Jahre"
          - "1 bis 5 Jahre"
          - "höchstens 1 Jahr (neueste zuerst)"
      quelle:
        description: "Welche Datenbanken abgefragt werden"
        required: false
        default: "alle"
        type: choice
        options:
          - "alle"
          - "nur Berlin"
          - "nur Brandenburg"
          - "nur Bund"
          - "nur Nordrhein-Westfalen"
          - "nur juris-Länderportale"
      schwerpunkt:
        description: "Optionaler Schwerpunkt, z. B. „Nachtragsmanagement“ (leer = freie Wahl)"
        required: false
        default: ""
      streitwert:
        description: "Nur Urteile mit hohem Streitwert (laut Urteil; ohne Angabe im Urteil entfällt es). Hohe Streitwerte sind seltener."
        required: false
        default: "egal"
        type: choice
        options:
          - "egal"
          - "ab 50.000 €"
          - "ab 100.000 €"
          - "ab 250.000 €"
          - "ab 500.000 €"
          - "ab 1 Mio. €"

run-name: "Urteilsbesprechung${{ github.event_name == 'schedule' && ' · Wochenplan' || '' }} · ${{ inputs.runden || '1' }} Runde(n) · ${{ inputs.alter || '1 bis 15 Jahre' }} · Streitwert ${{ inputs.streitwert || 'egal' }}"

concurrency:
  # Urteilsbesprechung und Urteil verständlich teilen sich diese Warteschlange:
  # Beide durchsuchen dieselben Datenbanken und würden gleichzeitig gestartet
  # dieselbe Entscheidung wählen. Startet man beide, wartet der zweite.
  # Mit Fachartikel und Vorlagen dürfen sie parallel laufen – jeder Agent
  # erkennt seinen Entwurf am Format im Dateikopf (tools/eigener_entwurf.py).
  # Hinweis: GitHub hält je Warteschlange nur EINEN wartenden Lauf. Für mehrere
  # Beiträge deshalb besser die Auswahl „Runden“ nutzen als mehrfach starten.
  group: urteil-agenten
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------
  # Runden planen: Die Auswahl „Runden“ wird zu einer Liste [1, 2, …], die
  # der eigentliche Job der Reihe nach abarbeitet (max-parallel: 1). Jede
  # Runde startet erst, wenn die vorige samt Prüfungen und Notion fertig ist –
  # so wählt sie automatisch das nächste offene Thema. Ist ein bestimmtes
  # Thema oder eine bestimmte Seite angegeben, gibt es nur eine Runde.
  # -----------------------------------------------------------------
  planen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read         # tools/kontingent.py auschecken
      issues: write          # abgelaufene Kontingent-Pause schließen
      pull-requests: read    # Entwürfe der Woche zählen
    outputs:
      liste: ${{ steps.plan.outputs.liste }}
      anzahl: ${{ steps.plan.outputs.anzahl }}
    steps:
      - name: Repository auschecken
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools

      - name: Kontingent prüfen (nur geplante Läufe)
        id: kontingent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/kontingent.py pruefen | tee -a "$GITHUB_OUTPUT"

      - name: Runden planen
        id: plan
        env:
          RUNDEN: ${{ inputs.runden }}
          RUNDEN_GEPLANT: "1"      # Runden je geplantem Lauf (Wochenplan)
          GEPLANT: ${{ github.event_name == 'schedule' }}
          LAUFEN: ${{ steps.kontingent.outputs.laufen }}
          FREI: ${{ steps.kontingent.outputs.frei }}
          GRUND: ${{ steps.kontingent.outputs.grund }}
          EINZELN: ""
        run: |
          set -euo pipefail
          if [ "$GEPLANT" = "true" ]; then
            if [ "${LAUFEN:-ja}" = "nein" ]; then
              echo "::notice title=Urteilsbesprechung::Geplanter Lauf entfällt – ${GRUND}."
              { echo "liste=[]"; echo "anzahl=0"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            N="$RUNDEN_GEPLANT"
            case "${FREI:-}" in ''|*[!0-9]*) ;; *) if [ "$FREI" -lt "$N" ]; then N="$FREI"; fi ;; esac
          else
            N="${RUNDEN:-1}"
          fi
          case "$N" in ''|*[!0-9]*) N=1 ;; esac
          if [ "$N" -lt 1 ]; then N=1; fi
          if [ "$N" -gt 5 ]; then N=5; fi
          if [ -n "$(printf '%s' "$EINZELN" | tr -d '[:space:]')" ] && [ "$N" -gt 1 ]; then
            echo "::warning title=Urteilsbesprechung::Ein bestimmtes Thema bzw. eine bestimmte Seite ist angegeben – es gibt nur eine Runde (sonst entstünde derselbe Beitrag mehrfach)."
            N=1
          fi
          echo "liste=[$(seq -s, 1 "$N")]" >> "$GITHUB_OUTPUT"
          echo "anzahl=$N" >> "$GITHUB_OUTPUT"
          echo "Geplant: $N Runde(n)."

  besprechung:
    needs: planen
    # Null Runden (Kontingent-Bremse): Job entfällt, ohne die leere Liste auszuwerten.
    if: needs.planen.outputs.anzahl != '0'
    name: "Runde ${{ matrix.runde }} von ${{ needs.planen.outputs.anzahl }}"
    strategy:
      # Nacheinander, nie gleichzeitig; ein Fehlschlag sagt die übrigen Runden ab.
      max-parallel: 1
      fail-fast: true
      matrix:
        runde: ${{ fromJSON(needs.planen.outputs.liste) }}
    runs-on: ubuntu-latest
    # Schreiben bis 60 Minuten (bei einem Fehlalarm des Sicherheitsfilters ein
    # zweiter Versuch bis 60), Faktenprüfung bis 50, Schlussprüfung bis 40,
    # dazu Bibliothek, Suche, Quellenabruf und Abschluss.
    timeout-minutes: 235

    permissions:
      contents: write        # Entwurf anlegen und Branch pushen
      pull-requests: write   # Pull Request öffnen, als Entwurf markieren und freigeben
      issues: write          # Kontingent-Pause als Issue (tools/kontingent.py)
      id-token: write        # von der Claude-Action benötigt

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git-Identität setzen
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fremde Hooks im Arbeitsverzeichnis dürfen nicht ausgeführt werden.
          git config core.hooksPath /dev/null

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Seitenbauer vorbereiten
        run: |
          set -euo pipefail
          # Der Agent baut die Artikelseite selbst, damit sie im selben Pull
          # Request landet. markdown wandelt den Entwurf in HTML, PyYAML liest
          # das Frontmatter. Versionen wie in seiten-bauen.yml. pypdf liest
          # PDF-Quellen für die Schlussprüfung.
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet 'markdown==3.7' 'PyYAML==6.0.2' 'pypdf==6.19.0'

      # -----------------------------------------------------------------
      # Fachbibliothek des Büros: Textauszüge der Fachbücher aus dem privaten
      # Repository FachwissenAgent, mit gedruckten Seitenzahlen und Katalog.
      # Ohne das Secret BIBLIOTHEK_TOKEN oder bei einem Fehler arbeitet der
      # Agent wie bisher ohne Bibliothek; der Lauf bricht deswegen nicht ab.
      # Freigegeben wird der Pull Request dann aber nicht: Die Prüfung auf
      # wörtliche Übernahmen braucht die Bibliothek (fail-closed).
      # -----------------------------------------------------------------
      - name: Fachbibliothek prüfen
        id: bib
        env:
          # Nur Ja/Nein, nie der Wert selbst.
          TOKEN_DA: ${{ secrets.BIBLIOTHEK_TOKEN != '' }}
        run: |
          echo "vorhanden=$TOKEN_DA" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_DA" != "true" ]; then
            echo "::notice title=Fachbibliothek::Secret BIBLIOTHEK_TOKEN fehlt – der Agent arbeitet ohne Fachbibliothek, und ohne Prüfung auf wörtliche Übernahmen bleibt der Pull Request ein Entwurf."
          fi

      - name: Fachbibliothek laden
        id: bibladen
        if: steps.bib.outputs.vorhanden == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bib-ingenieurbuero/FachwissenAgent
          token: ${{ secrets.BIBLIOTHEK_TOKEN }}
          path: .bibliothek
          # Der Zugangsschlüssel bleibt nicht im Arbeitsverzeichnis liegen,
          # das der Agent lesen kann.
          persist-credentials: false

      - name: Suchindex der Fachbibliothek bauen
        id: bibindex
        if: steps.bibladen.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/bibliothek_suchen.py .bibliothek --index
          echo "ordner=.bibliothek" >> "$GITHUB_OUTPUT"

      - name: Fachbibliothek nicht ladbar
        if: steps.bibladen.outcome == 'failure'
        run: |
          echo "::warning title=Fachbibliothek::Die Fachbibliothek konnte nicht geladen werden. Meist ist der Zugangsschlüssel BIBLIOTHEK_TOKEN abgelaufen – bitte erneuern. Der Agent arbeitet in diesem Lauf ohne Bibliothek."

      - name: Kandidaten suchen
        id: kandidaten
        env:
          # Eingaben nie direkt in die Shell schreiben, sondern über die Umgebung.
          ALTER: ${{ inputs.alter }}
          QUELLE: ${{ inputs.quelle }}
          STREITWERT: ${{ inputs.streitwert }}
          # Zum Abgleich mit Entwürfen in offenen Pull Requests (keine Doppelbesprechung).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Das Laufdatum kommt aus dem Runner, nicht aus Repository-Metadaten.
          echo "heute=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Startzeitpunkt merken: Nur ein danach entstandener PR gehört zu diesem Lauf.
          echo "beginn=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          ARBEIT="$RUNNER_TEMP/urteil"
          mkdir -p "$ARBEIT"
          LISTE="$ARBEIT/kandidaten.md"

          case "$QUELLE" in
            "nur Brandenburg")          NUR=(--nur brandenburg) ;;
            "nur Bund")                 NUR=(--nur bund) ;;
            "nur Nordrhein-Westfalen")  NUR=(--nur nrw) ;;
            "nur Berlin")               NUR=(--nur berlin) ;;
            "nur juris-Länderportale")  NUR=(--nur laender) ;;
            *)                          NUR=() ;;
          esac

          # Alter der Entscheidungen. Vorgabe sind Grundsatzentscheidungen, die 1 bis
          # 15 Jahre zurückliegen; die Suche ordnet sie nach Gewicht (Leitsatz, Gericht)
          # statt nach Datum. „höchstens 1 Jahr“ liefert wie früher die jüngsten zuerst.
          case "${ALTER:-1 bis 15 Jahre}" in
            "1 bis 10 Jahre")     ZEIT=(--alter-von 1 --alter-bis 10); ZEIT_TEXT="1 bis 10 Jahre alt ist" ;;
            "1 bis 5 Jahre")      ZEIT=(--alter-von 1 --alter-bis 5);  ZEIT_TEXT="1 bis 5 Jahre alt ist" ;;
            "höchstens 1 Jahr"*)  ZEIT=(--monate 12);                  ZEIT_TEXT="höchstens 1 Jahr alt ist" ;;
            *)                    ZEIT=(--alter-von 1 --alter-bis 15); ZEIT_TEXT="1 bis 15 Jahre alt ist" ;;
          esac

          # Streitwertgrenze: Die Suche liest den Streitwert aus dem Volltext und
          # behält nur Entscheidungen ab dieser Grenze (tools/urteile_finden.py).
          case "${STREITWERT:-egal}" in
            "ab 50.000 €")   SW=50000 ;;
            "ab 100.000 €")  SW=100000 ;;
            "ab 250.000 €")  SW=250000 ;;
            "ab 500.000 €")  SW=500000 ;;
            "ab 1 Mio. €")   SW=1000000 ;;
            *)               SW=0 ;;
          esac
          SW_ARG=()
          if [ "$SW" -gt 0 ]; then
            SW_ARG=(--streitwert-ab "$SW")
            echo "Nur Entscheidungen mit einem Streitwert ${STREITWERT}."
          fi

          # Die Rechtsprechungsportale sind von GitHub aus nicht immer erreichbar
          # (30.09.2026: zweimal Zeitüberschreitung bei Berlin und Bund, beide
          # Läufe brachen ab). Rückgabewert 2 heißt „keine Quelle erreichbar“:
          # dann nach drei Minuten ein zweiter Versuch.
          for versuch in 1 2; do
            set +e
            python tools/urteile_finden.py \
              --ziel "$LISTE" \
              "${ZEIT[@]}" \
              --max 12 \
              --pause 1.0 \
              "${NUR[@]}" "${SW_ARG[@]}" 2>&1 | tee "$ARBEIT/suche.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 2 ]; then break; fi
            if [ "$versuch" -eq 1 ]; then
              echo "::warning title=Urteilsbesprechung::Die Rechtsprechungsportale waren nicht erreichbar – zweiter Versuch in drei Minuten."
              sleep 180
            fi
          done
          if [ "$rc" -eq 2 ]; then
            echo "::error title=Urteilsbesprechung::Keine der gewählten Rechtsprechungsdatenbanken war erreichbar (zwei Versuche, Zeitüberschreitung). Das liegt an den Portalen, nicht am Agenten. Bitte später erneut starten oder bei „Quelle“ die Auswahl „alle“ nehmen."
            exit 2
          fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          if grep -q "## Keine Kandidaten" "$LISTE"; then
            SW_TEXT=""; SW_HINWEIS=""
            if [ "$SW" -gt 0 ]; then SW_TEXT=" mit Streitwert ${STREITWERT}"; SW_HINWEIS=" oder niedrigeren Streitwert"; fi
            echo "::warning title=Urteilsbesprechung::Es wurde keine noch nicht besprochene Entscheidung${SW_TEXT} gefunden, die ${ZEIT_TEXT}. Anderen Zeitraum wählen${SW_HINWEIS}."
            echo "gefunden=false" >> "$GITHUB_OUTPUT"
          else
            echo "gefunden=true" >> "$GITHUB_OUTPUT"
          fi

          echo "liste=$LISTE" >> "$GITHUB_OUTPUT"
          # Der Agent braucht Zugriff auf dieses Verzeichnis: Es liegt außerhalb
          # des Checkouts und enthält Kandidatenliste und Volltexte.
          echo "verzeichnis=$ARBEIT" >> "$GITHUB_OUTPUT"

          {
            echo '## Kandidatensuche'
            echo
            echo '```'
            cat "$ARBEIT/suche.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Für einen möglichen zweiten Versuch: Stand des Arbeitsverzeichnisses
      # vor dem Agenten merken.
      - name: Stand vor dem Agenten merken
        id: vorher
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "zweig=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Besprechung schreiben lassen
        id: claude
        # Ein Fehlschlag wird unten ausgewertet (Fehlalarm → zweiter Versuch).
        continue-on-error: true
        if: steps.kandidaten.outputs.gefunden == 'true'
        timeout-minutes: 60   # lässt Fakten- und Schlussprüfung Zeit innerhalb der 235 Job-Minuten
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /urteilsbesprechung
            Kandidatenliste: ${{ steps.kandidaten.outputs.liste }}
            Datum: ${{ steps.kandidaten.outputs.heute }}
            Schwerpunkt: ${{ inputs.schwerpunkt }}
            Bibliothek: ${{ steps.bibindex.outputs.ordner || 'nicht verfügbar' }}

            Lies zuerst .claude/skills/fachartikel/SKILL.md vollständig, dann die
            Kandidatenliste. Ist ein Schwerpunkt genannt, bevorzuge Entscheidungen
            dazu, solange sie fachlich tragen; sonst wähle frei nach der Reihenfolge
            der Liste.
          # --add-dir: Kandidatenliste und Volltexte liegen im Runner-Temp, nicht im Checkout.
          #   Ohne diese Freigabe kann der Agent die Liste nicht lesen und bricht ab.
          # --allowedTools: bewusst redundant zur SKILL.md, damit der Lauf auch dann trägt,
          #   wenn die Skill-Datei einmal abweicht. „git config“ fehlt absichtlich.
          claude_args: |
            --max-turns 170
            --model claude-opus-5-5
            --add-dir ${{ steps.kandidaten.outputs.verzeichnis }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,WebSearch,WebFetch,Bash(wc:*),Bash(ls:*),Bash(mkdir:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(python tools/artikel_generator.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/bibliothek_suchen.py:*),Bash(python tools/wortgleich_pruefen.py:*),Bash(python tools/normstand_pruefen.py:*)"

      # Fehlalarm des Sicherheitsfilters (02.10.2026, Fachartikel Runde 3): Die
      # API bricht mit „safeguards flagged this message“ ab und empfiehlt eine
      # neue Sitzung oder ein anderes Modell. Dann folgt ein zweiter Versuch mit
      # Opus 5 – aber nur, wenn der erste noch nichts veröffentlicht hat
      # (tools/zweiter_versuch.py). Andere Fehler bekommen keinen zweiten Versuch.
      - name: Zweiter Versuch nötig?
        id: fehlalarm
        if: steps.claude.outcome == 'failure'
        env:
          VERLAUF: ${{ steps.claude.outputs.execution_file }}
          START_SHA: ${{ steps.vorher.outputs.sha }}
          START_ZWEIG: ${{ steps.vorher.outputs.zweig }}
        run: |
          set -euo pipefail
          VERLAUF="${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}"
          python tools/agent_bericht.py "$VERLAUF" --titel "Erster Versuch"
          python tools/zweiter_versuch.py "$VERLAUF"
          if grep -q "^zweiter_versuch=true" "$GITHUB_OUTPUT"; then
            # Was der erste Versuch lokal angelegt hat, verwerfen (veröffentlicht hat er nichts).
            git checkout -q -f "$START_ZWEIG" 2>/dev/null || git checkout -q -f "$START_SHA"
            git reset -q --hard "$START_SHA"
            git clean -q -fd -- entwuerfe fachwissen vorlagen
            echo "::warning title=Agent::Fehlalarm des Sicherheitsfilters im ersten Versuch – zweiter Versuch mit Opus 5."
          fi

      - name: Besprechung schreiben lassen (zweiter Versuch, Opus 5)
        id: claude2
        continue-on-error: true
        if: steps.fehlalarm.outputs.zweiter_versuch == 'true'
        timeout-minutes: 60   # lässt Fakten- und Schlussprüfung Zeit innerhalb der 235 Job-Minuten
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /urteilsbesprechung
            Kandidatenliste: ${{ steps.kandidaten.outputs.liste }}
            Datum: ${{ steps.kandidaten.outputs.heute }}
            Schwerpunkt: ${{ inputs.schwerpunkt }}
            Bibliothek: ${{ steps.bibindex.outputs.ordner || 'nicht verfügbar' }}

            Lies zuerst .claude/skills/fachartikel/SKILL.md vollständig, dann die
            Kandidatenliste. Ist ein Schwerpunkt genannt, bevorzuge Entscheidungen
            dazu, solange sie fachlich tragen; sonst wähle frei nach der Reihenfolge
            der Liste.
          # --add-dir: Kandidatenliste und Volltexte liegen im Runner-Temp, nicht im Checkout.
          #   Ohne diese Freigabe kann der Agent die Liste nicht lesen und bricht ab.
          # --allowedTools: bewusst redundant zur SKILL.md, damit der Lauf auch dann trägt,
          #   wenn die Skill-Datei einmal abweicht. „git config“ fehlt absichtlich.
          claude_args: |
            --max-turns 170
            --model claude-opus-5
            --add-dir ${{ steps.kandidaten.outputs.verzeichnis }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,WebSearch,WebFetch,Bash(wc:*),Bash(ls:*),Bash(mkdir:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(python tools/artikel_generator.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/bibliothek_suchen.py:*),Bash(python tools/wortgleich_pruefen.py:*),Bash(python tools/normstand_pruefen.py:*)"

      # Wochenlimit des Claude-Abos erreicht? Dann pausieren die geplanten Läufe
      # bis zum Neustart (Issue „Agenten pausieren bis …“, tools/kontingent.py).
      - name: Kontingent prüfen
        id: limit
        if: ${{ always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERLAUF: ${{ steps.claude2.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: python3 tools/kontingent.py erkennen "${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}" | tee -a "$GITHUB_OUTPUT"

      # Ein Ergebnis für alle folgenden Schritte: Erfolg, wenn einer der beiden
      # Versuche erfolgreich war. Sonst scheitert die Runde hier – genau wie
      # früher am Schreibschritt selbst.
      - name: Ergebnis des Agenten
        id: agent
        if: ${{ always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != '' }}
        env:
          ERSTER: ${{ steps.claude.outcome }}
          ZWEITER: ${{ steps.claude2.outcome }}
        run: |
          if [ "$ERSTER" = "success" ] || [ "$ZWEITER" = "success" ]; then
            echo "ergebnis=success" >> "$GITHUB_OUTPUT"
            if [ "$ZWEITER" = "success" ]; then
              echo "::notice title=Agent::Der zweite Versuch mit Opus 5 war erfolgreich."
            fi
            exit 0
          fi
          echo "ergebnis=failure" >> "$GITHUB_OUTPUT"
          exit 1


      # Die Claude-Aktion zeigt im Protokoll nur Kennzahlen. Dieser Schritt macht
      # sichtbar, was der Agent gemeldet hat, welche Befehle abgelehnt wurden und
      # welche Werkzeuge Fehler hatten – sonst bleibt ein stilles Scheitern
      # („Erfolg, aber kein Pull Request“) unerklärlich. Nichts aus der
      # Auftragsdatei gelangt ins Protokoll.
      - name: Abschlussmeldung des Agenten
        if: ${{ always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != '' }}
        continue-on-error: true
        env:
          VERLAUF: ${{ steps.claude2.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: python tools/agent_bericht.py "${VERLAUF:-$RUNNER_TEMP/claude-execution-output.json}"
      # -----------------------------------------------------------------
      # Faktenprüfung. Ein zweiter, unabhängiger Agent vergleicht jede Aussage
      # über die besprochene Entscheidung mit ihrer Randnummer im Volltext und
      # korrigiert Abweichungen. Anlass: Der erste Artikel gab das Urteil an
      # fünfzehn Stellen falsch wieder, obwohl der Volltext vollständig vorlag –
      # geschrieben wurde über viele Züge aus der Erinnerung, geprüft nie.
      # -----------------------------------------------------------------
      - name: Entwurf für die Prüfungen bestimmen
        id: ziel
        if: steps.agent.outputs.ergebnis == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEGINN: ${{ steps.kandidaten.outputs.beginn }}
          ARBEIT: ${{ steps.kandidaten.outputs.verzeichnis }}
        run: |
          set -euo pipefail
          # Nur der eigene Entwurf dieses Laufs, erkannt am Format im Dateikopf.
          ZEILE="$(python tools/eigener_entwurf.py --seit "$BEGINN" --format "Rechtsprechung" --fassung "")"
          if [ -z "$ZEILE" ]; then
            # Kein eigener Entwurf erkannt (abweichender Dateikopf, GitHub-Fehler): Ein in diesem
            # Lauf entstandener Pull Request bleibt dann ein Entwurf – ungeprüft wird nichts mergebar.
            gh pr list --state open --author "app/github-actions" --search "created:>=$BEGINN" \
              --json number,isDraft --jq '.[] | select(.isDraft | not) | .number' 2> /dev/null \
              | while IFS= read -r OFFEN; do
                  gh pr ready "$OFFEN" --undo > /dev/null 2>&1 \
                    && echo "::warning title=Prüfung::Pull Request #$OFFEN als Entwurf markiert – kein geprüfter Entwurf erkannt, bitte selbst prüfen."
                done || true
            echo "::notice title=Prüfung::Kein neuer Entwurf – nichts zu prüfen."
            echo "entwurf_da=false" >> "$GITHUB_OUTPUT"
            echo "pruefen=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NR="${ZEILE%% *}"
          ZWEIG="${ZEILE#* }"
          # Bis Fakten- und Schlussprüfung fertig sind, bleibt der Pull Request ein Entwurf: Der
          # Merge-Knopf ist gesperrt. Anlass: Am 02.10.2026 wurden Entwürfe zusammengeführt, bevor
          # ihre Prüfkorrekturen da waren – die Korrekturen fehlten danach auf der Website.
          if [ "$(gh pr view "$NR" --json isDraft --jq '.isDraft')" != "true" ]; then
            gh pr ready "$NR" --undo > /dev/null 2>&1 \
              || echo "::warning title=Prüfung::Pull Request #$NR ließ sich nicht als Entwurf markieren – bitte erst nach den Prüfkommentaren zusammenführen."
          fi
          echo "freigeben=$NR" >> "$GITHUB_OUTPUT"
          git fetch -q origin "$ZWEIG"
          git checkout -q -B "$ZWEIG" "origin/$ZWEIG"

          ENTWURF="$(gh pr view "$NR" --json files \
                      --jq '[.files[].path | select(startswith("entwuerfe/") and endswith(".md") and (ascii_downcase | endswith("readme.md") | not))][0] // ""')"
          if [ -z "$ENTWURF" ] || [ ! -f "$ENTWURF" ]; then
            echo "::warning title=Prüfung::Im Pull Request #$NR ist keine Entwurfsdatei zu finden."
            echo "entwurf_da=false" >> "$GITHUB_OUTPUT"
            echo "pruefen=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Die Schlussprüfung läuft auch dann, wenn der Volltext fehlt; die
          # Faktenprüfung nur mit Volltext. Der Diff bleibt leer, bis die
          # Faktenprüfung etwas ändert.
          : > "$ARBEIT/faktenpruefung.diff"
          {
            echo "entwurf_da=true"
            echo "nummer=$NR"
            echo "zweig=$ZWEIG"
            echo "entwurf=$ENTWURF"
            echo "bericht=$ARBEIT/faktenpruefung.md"
            echo "diff=$ARBEIT/faktenpruefung.diff"
            echo "schlussbericht=$ARBEIT/schlusspruefung.md"
          } >> "$GITHUB_OUTPUT"

          # Der Volltext liegt aus dem Suchlauf bereit; fehlt er, wird er von der
          # Fundstelle des Entwurfs nachgeladen.
          AZ="$(grep -m1 '^aktenzeichen:' "$ENTWURF" | sed 's/^aktenzeichen:[[:space:]]*//; s/^"//; s/"$//')"
          DATEI="$(python -c 'import sys; sys.path.insert(0, "tools"); import urteile_finden as u; print(u.dateiname(sys.argv[1]))' "$AZ")"
          VOLLTEXT="$ARBEIT/volltexte/$DATEI.txt"
          if [ ! -f "$VOLLTEXT" ]; then
            VOLLTEXT="$(python tools/volltext_laden.py "$ENTWURF" "$ARBEIT/volltexte" | tail -n 1)" || VOLLTEXT=""
          fi
          if [ -z "$VOLLTEXT" ] || [ ! -f "$VOLLTEXT" ]; then
            echo "::warning title=Faktenprüfung::Volltext zu $AZ nicht verfügbar – keine Faktenprüfung."
            gh pr comment "$NR" --body "⚠️ Die automatische Faktenprüfung konnte nicht laufen: Der Volltext zu $AZ war nicht verfügbar. Bitte die Aussagen über die Entscheidung vor dem Merge selbst gegen den Volltext prüfen."
            echo "pruefen=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pruefen=true" >> "$GITHUB_OUTPUT"
          echo "volltext=$VOLLTEXT" >> "$GITHUB_OUTPUT"

      # Prüfwerkzeuge und Freigabeliste immer vom Hauptzweig, nie aus dem Zweig
      # des Agenten: Dort könnte tools/wortgleich_pruefen.py oder
      # tools/wortgleich_erlaubt.txt geändert sein. Ohne sie gilt alles Folgende
      # als nicht geprüft – keine Korrektur wird gepusht, kein Bericht
      # kommentiert, nichts freigegeben (fail-closed).
      - name: Prüfwerkzeuge vom Hauptzweig holen
        id: werkzeug
        if: ${{ !cancelled() && steps.ziel.outputs.freigeben != '' }}
        run: |
          set -uo pipefail
          ZIEL="$RUNNER_TEMP/pruefwerkzeug"
          rm -rf "$ZIEL"
          mkdir -p "$ZIEL"
          if ! git fetch -q --no-tags --depth=1 origin main; then
            echo "::warning title=Prüfwerkzeuge::Hauptzweig nicht ladbar – wörtliche Übernahmen und Normstand bleiben ungeprüft, der Pull Request bleibt ein Entwurf."
            exit 0
          fi
          for datei in wortgleich_pruefen.py wortgleich_erlaubt.txt normstand_pruefen.py bibliothek_suchen.py; do
            if ! git show "FETCH_HEAD:tools/$datei" > "$ZIEL/$datei"; then
              echo "::warning title=Prüfwerkzeuge::tools/$datei fehlt auf dem Hauptzweig – wörtliche Übernahmen und Normstand bleiben ungeprüft."
              exit 0
            fi
          done
          echo "ordner=$ZIEL" >> "$GITHUB_OUTPUT"

      - name: Fakten gegen den Volltext prüfen
        id: pruefung
        if: steps.ziel.outputs.pruefen == 'true'
        # Scheitert die Prüfung, bleibt der Entwurf bestehen; der nächste Schritt
        # vermerkt das im Pull Request.
        continue-on-error: true
        timeout-minutes: 50
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /faktenpruefung
            Entwurf: ${{ steps.ziel.outputs.entwurf }}
            Volltext: ${{ steps.ziel.outputs.volltext }}
            Bericht: ${{ steps.ziel.outputs.bericht }}
          # Kein Netz, kein git, kein gh: Der Prüfer vergleicht nur Entwurf und
          # Volltext und korrigiert den Entwurf. Commit und Kommentar macht der
          # nächste Schritt.
          claude_args: |
            --max-turns 110
            --model claude-opus-5-5
            --add-dir ${{ steps.kandidaten.outputs.verzeichnis }}
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Skill,Bash(python tools/artikel_generator.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/wortgleich_pruefen.py:*),Bash(python tools/normstand_pruefen.py:*),Bash(wc:*)"

      - name: Prüfergebnis in den Pull Request übernehmen
        if: steps.ziel.outputs.pruefen == 'true'
        env:
          WERKZEUG: ${{ steps.werkzeug.outputs.ordner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NR: ${{ steps.ziel.outputs.nummer }}
          ZWEIG: ${{ steps.ziel.outputs.zweig }}
          ENTWURF: ${{ steps.ziel.outputs.entwurf }}
          BERICHT: ${{ steps.ziel.outputs.bericht }}
          DIFF: ${{ steps.ziel.outputs.diff }}
          PRUEFUNG: ${{ steps.pruefung.outcome }}
        run: |
          set -euo pipefail
          # Die Schlussprüfung prüft jede Änderung der Faktenprüfung noch einmal
          # gegen den Volltext – dafür wird der Diff vor dem Commit gesichert.
          git diff -U0 -- "$ENTWURF" > "$DIFF" || true
          # Fehler in fremden Entwürfen dürfen hier nicht stoppen.
          python tools/artikel_generator.py > /dev/null || true
          # Was in den öffentlichen Zweig oder Pull Request geht, wird vorher auf wörtliche
          # Übernahmen geprüft (Werkzeug vom Hauptzweig, Fachbibliothek und geladene Quelltexte).
          # Rückgabewert 0 nur ohne Treffer; ohne Werkzeug oder Bibliothek nicht 0 (fail-closed).
          wortgleich_frei() {
            local zusatz=() ordner
            if [ -z "${WERKZEUG:-}" ] || [ ! -f "$WERKZEUG/wortgleich_pruefen.py" ]; then return 2; fi
            if [ -d .bibliothek/.git ] && { ! git -C .bibliothek diff --quiet HEAD -- \
                 || [ -n "$(git -C .bibliothek ls-files --others --exclude-standard -- texte forschung gemeinfrei normen katalog.yml)" ]; }; then
              return 2
            fi
            while IFS= read -r ordner; do zusatz+=(--zusatz "$ordner"); done \
              < <(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 4 -type d -name quellen 2> /dev/null)
            python "$WERKZEUG/wortgleich_pruefen.py" "$@" --bibliothek .bibliothek "${zusatz[@]}" > /dev/null 2>&1
          }
          geaenderte_texte_frei() {
            local dateien=() pfad
            while IFS= read -r pfad; do
              if [ -f "$pfad" ]; then dateien+=("$pfad"); fi
            done < <(git diff --name-only -- 'entwuerfe/*.md' 'entwuerfe-en/*.md' 'vorlagen/*.yml')
            if [ "${#dateien[@]}" -eq 0 ]; then return 0; fi
            wortgleich_frei "${dateien[@]}"
          }
          if ! git diff --quiet -- entwuerfe fachwissen sitemap.xml; then
            if geaenderte_texte_frei; then
              git add entwuerfe fachwissen sitemap.xml
              git commit -q -m "Faktenpruefung: Korrekturen gegen den Volltext" \
                            -m "Automatisch nach dem Schreiben geprueft. Einzelheiten im Kommentar des Pull Requests."
              git push -q origin "HEAD:$ZWEIG"
            else
              # Nicht in den öffentlichen Zweig: Die Korrekturen bleiben im Runner.
              git reset -q --hard HEAD
              if [ -n "${DIFF:-}" ]; then : > "$DIFF"; fi
              echo "::warning title=Faktenprüfung::Korrekturen nicht übernommen – die geänderte Fassung stimmt stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder die Prüfung war nicht möglich."
              gh pr comment "$NR" --body "⚠️ Die Korrekturen der Faktenprüfung sind nicht übernommen: Die geänderte Fassung stimmt stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder diese Prüfung war nicht möglich. Der Pull Request bleibt ein Entwurf; bitte die Aussagen vor dem Merge selbst prüfen."
            fi
          fi
          if [ -s "$BERICHT" ] && wortgleich_frei "$BERICHT"; then
            gh pr comment "$NR" --body-file "$BERICHT"
          elif [ -s "$BERICHT" ]; then
            gh pr comment "$NR" --body "⚠️ Der Bericht der Faktenprüfung erscheint hier nicht: Er stimmt stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder diese Prüfung war nicht möglich. Er bleibt im Runner; bitte die Aussagen vor dem Merge selbst prüfen."
          else
            gh pr comment "$NR" --body "⚠️ Die automatische Faktenprüfung ist nicht vollständig durchgelaufen (Ergebnis: ${PRUEFUNG}). Bitte die Aussagen über die Entscheidung vor dem Merge selbst gegen den Volltext prüfen."
          fi

      # -----------------------------------------------------------------
      # Schlussprüfung. Anlass: Beim Beitrag zu OVG 6 A 1/25 standen nach der
      # Faktenprüfung noch Fußnoten mit „Inhaltlich bestätigt durch …“, deren
      # Quelle die Zahlen gar nicht enthielt, ein Gesetz in der falschen Fassung
      # und ein erfundener Rechtsmittelhinweis. Ein Skript lädt deshalb jede
      # Fußnotenquelle herunter; ein unabhängiger Agent vergleicht jeden
      # belegten Satz mit dem Quelltext.
      # -----------------------------------------------------------------
      - name: Quellen für die Schlussprüfung laden
        id: quellen
        if: ${{ !cancelled() && steps.ziel.outputs.entwurf_da == 'true' }}
        env:
          ENTWURF: ${{ steps.ziel.outputs.entwurf }}
          VOLLTEXT: ${{ steps.ziel.outputs.volltext }}
          ARBEIT: ${{ steps.kandidaten.outputs.verzeichnis }}
        run: |
          set -euo pipefail
          VT=()
          if [ -n "$VOLLTEXT" ] && [ -f "$VOLLTEXT" ]; then
            VT=(--volltext "$VOLLTEXT")
          fi
          if [ -f .bibliothek/katalog.yml ]; then VT+=(--bibliothek .bibliothek); fi
          if ! AUSGABE="$(python tools/quellen_laden.py "$ENTWURF" "$ARBEIT/schlusspruefung" "${VT[@]}")"; then
            echo "::warning title=Schlussprüfung::Quellen nicht ladbar – $(printf '%s\n' "$AUSGABE" | tail -n 1)"
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$AUSGABE"
          echo "pruefliste=$(printf '%s\n' "$AUSGABE" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "bereit=true" >> "$GITHUB_OUTPUT"

      - name: Schlussprüfung gegen die Quellen
        id: schluss
        if: ${{ !cancelled() && steps.quellen.outputs.bereit == 'true' }}
        continue-on-error: true
        timeout-minutes: 40
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /schlusspruefung
            Entwurf: ${{ steps.ziel.outputs.entwurf }}
            Prüfliste: ${{ steps.quellen.outputs.pruefliste }}
            Volltext: ${{ steps.ziel.outputs.volltext }}
            Änderungen der Faktenprüfung: ${{ steps.ziel.outputs.diff }}
            Bericht: ${{ steps.ziel.outputs.schlussbericht }}
            Bibliothek: ${{ steps.bibindex.outputs.ordner || 'nicht verfügbar' }}
          # Kein git, kein gh. Web nur, um eine tote Adresse desselben Dokuments
          # zu ersetzen oder eine nicht ladbare Quelle einmal nachzulesen
          # (höchstens zwölf Aufrufe laut Skill).
          claude_args: |
            --max-turns 80
            --model claude-opus-5-5
            --add-dir ${{ steps.kandidaten.outputs.verzeichnis }}
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Skill,WebFetch,WebSearch,Bash(python tools/artikel_generator.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/bibliothek_suchen.py:*),Bash(python tools/wortgleich_pruefen.py:*),Bash(python tools/normstand_pruefen.py:*),Bash(wc:*)"

      - name: Ergebnis der Schlussprüfung übernehmen
        if: ${{ !cancelled() && steps.quellen.outputs.bereit == 'true' }}
        env:
          WERKZEUG: ${{ steps.werkzeug.outputs.ordner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NR: ${{ steps.ziel.outputs.nummer }}
          ZWEIG: ${{ steps.ziel.outputs.zweig }}
          BERICHT: ${{ steps.ziel.outputs.schlussbericht }}
          PRUEFUNG: ${{ steps.schluss.outcome }}
        run: |
          set -euo pipefail
          python tools/artikel_generator.py > /dev/null || true
          # Was in den öffentlichen Zweig oder Pull Request geht, wird vorher auf wörtliche
          # Übernahmen geprüft (Werkzeug vom Hauptzweig, Fachbibliothek und geladene Quelltexte).
          # Rückgabewert 0 nur ohne Treffer; ohne Werkzeug oder Bibliothek nicht 0 (fail-closed).
          wortgleich_frei() {
            local zusatz=() ordner
            if [ -z "${WERKZEUG:-}" ] || [ ! -f "$WERKZEUG/wortgleich_pruefen.py" ]; then return 2; fi
            if [ -d .bibliothek/.git ] && { ! git -C .bibliothek diff --quiet HEAD -- \
                 || [ -n "$(git -C .bibliothek ls-files --others --exclude-standard -- texte forschung gemeinfrei normen katalog.yml)" ]; }; then
              return 2
            fi
            while IFS= read -r ordner; do zusatz+=(--zusatz "$ordner"); done \
              < <(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 4 -type d -name quellen 2> /dev/null)
            python "$WERKZEUG/wortgleich_pruefen.py" "$@" --bibliothek .bibliothek "${zusatz[@]}" > /dev/null 2>&1
          }
          geaenderte_texte_frei() {
            local dateien=() pfad
            while IFS= read -r pfad; do
              if [ -f "$pfad" ]; then dateien+=("$pfad"); fi
            done < <(git diff --name-only -- 'entwuerfe/*.md' 'entwuerfe-en/*.md' 'vorlagen/*.yml')
            if [ "${#dateien[@]}" -eq 0 ]; then return 0; fi
            wortgleich_frei "${dateien[@]}"
          }
          if ! git diff --quiet -- entwuerfe fachwissen sitemap.xml; then
            if geaenderte_texte_frei; then
              git add entwuerfe fachwissen sitemap.xml
              git commit -q -m "Schlusspruefung: Korrekturen gegen die Quellen" \
                            -m "Automatisch nach der Faktenpruefung geprueft. Einzelheiten im Kommentar des Pull Requests."
              git push -q origin "HEAD:$ZWEIG"
            else
              # Nicht in den öffentlichen Zweig: Die Korrekturen bleiben im Runner.
              git reset -q --hard HEAD
              if [ -n "${DIFF:-}" ]; then : > "$DIFF"; fi
              echo "::warning title=Schlussprüfung::Korrekturen nicht übernommen – die geänderte Fassung stimmt stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder die Prüfung war nicht möglich."
              gh pr comment "$NR" --body "⚠️ Die Korrekturen der Schlussprüfung sind nicht übernommen: Die geänderte Fassung stimmt stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder diese Prüfung war nicht möglich. Der Pull Request bleibt ein Entwurf; bitte die Aussagen vor dem Merge selbst prüfen."
            fi
          fi
          if [ -s "$BERICHT" ] && wortgleich_frei "$BERICHT"; then
            gh pr comment "$NR" --body-file "$BERICHT"
          elif [ -s "$BERICHT" ]; then
            gh pr comment "$NR" --body "⚠️ Der Bericht der Schlussprüfung erscheint hier nicht: Er stimmt stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder diese Prüfung war nicht möglich. Er bleibt im Runner; bitte die Aussagen vor dem Merge selbst prüfen."
          else
            gh pr comment "$NR" --body "⚠️ Die Schlussprüfung gegen die Quellen ist nicht vollständig durchgelaufen (Ergebnis: ${PRUEFUNG}). Bitte Zahlen und Fußnoten vor dem Merge selbst an den Quellen prüfen."
          fi

      # -----------------------------------------------------------------
      # Wörtliche Übernahmen und Normstand – ohne KI, nach der Schlussprüfung
      # und vor der Freigabe. tools/wortgleich_pruefen.py sucht Wortfolgen der
      # Entwürfe und Vorlagen-Beschreibungen (vorlagen/<kurzform>.yml, sie
      # werden als PDF, DOCX und XLSX veröffentlicht), die wörtlich in der
      # Fachbibliothek oder in den für die Schlussprüfung geladenen
      # Quelltexten stehen; tools/normstand_pruefen.py vergleicht die genannten
      # Normausgaben mit dem Normenindex der Bibliothek (normen/ausgaben.yml).
      # Beide Werkzeuge kommen vom Hauptzweig (Schritt „Prüfwerkzeuge vom
      # Hauptzweig holen“), nie aus dem Zweig des Agenten. Die Berichte nennen
      # nur Stellen im Entwurf (Datei, Abschnitt, Zeile, Länge) – nie Werk,
      # Seite oder Text aus der Bibliothek – und kommen als Kommentar in den
      # Pull Request. Fail-closed:
      # Meldet ein Werkzeug einen Befund, kann es nicht prüfen (Werkzeug,
      # Bibliothek oder Normenindex fehlt, Bibliothek im Lauf verändert) oder
      # ändert der Pull Request Werkzeuge, Workflows oder Anweisungen, bleibt
      # er ein Entwurf.
      # -----------------------------------------------------------------
      - name: Wörtliche Übernahmen und Normstand prüfen (ohne KI)
        id: wortlaut
        if: ${{ !cancelled() && steps.ziel.outputs.freigeben != '' }}
        env:
          WERKZEUG: ${{ steps.werkzeug.outputs.ordner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NR: ${{ steps.ziel.outputs.freigeben }}
          TITEL: "Urteilsbesprechung"
        run: |
          set -uo pipefail
          # GitHub startet run-Schritte mit „bash -e“. Rückgabewert 1 (Befund) oder 2 (nicht
          # geprüft) der Werkzeuge würde den Schritt sonst ohne Bericht abbrechen. Jeder
          # Rückgabewert wird ausdrücklich ausgewertet; freigegeben wird nur ohne Grund.
          set +e
          ARBEIT="$RUNNER_TEMP/wortlaut"
          rm -rf "$ARBEIT"
          mkdir -p "$ARBEIT"
          KOMMENTAR="$ARBEIT/kommentar.md"
          GRUENDE=()
          # Dateien des Pull Requests: Entwürfe (deutsch und englisch, ohne Übersichten) und
          # Vorlagen-Beschreibungen werden geprüft. Ändert er Prüfwerkzeuge, Workflows oder
          # Anweisungen, gibt ihn nur der Inhaber frei.
          ENTWUERFE=()
          if gh pr view "$NR" --json files --jq '.files[].path' > "$ARBEIT/dateien.txt"; then
            while IFS= read -r pfad; do
              case "$pfad" in
                tools/*|.github/*|.claude/*|tests/*|CLAUDE.md|.bibliothek/*)
                  GRUENDE+=("der Pull Request ändert $pfad – Prüfwerkzeuge, Workflows und Anweisungen ändert nur der Inhaber") ;;
                *[Rr][Ee][Aa][Dd][Mm][Ee].md) ;;
                entwuerfe/*.md|entwuerfe-en/*.md|vorlagen/*.yml)
                  if [ -f "$pfad" ]; then ENTWUERFE+=("$pfad"); fi ;;
              esac
            done < "$ARBEIT/dateien.txt"
          fi
          if [ "${#ENTWUERFE[@]}" -eq 0 ]; then
            echo "::error title=$TITEL::Pull Request #$NR: keine Entwurfsdatei gefunden (oder Pull Request nicht lesbar) – wörtliche Übernahmen und Normstand nicht geprüft. Der Pull Request bleibt ein Entwurf."
            gh pr comment "$NR" --body "⛔ Die automatische Prüfung auf wörtliche Übernahmen und Normstand hat keine Entwurfsdatei gefunden. Der Pull Request bleibt ein Entwurf; bitte vor dem Merge selbst prüfen." || true
            echo "freigabe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WORT=2
          NORM=2
          if [ -z "${WERKZEUG:-}" ] || [ ! -f "$WERKZEUG/wortgleich_pruefen.py" ] || [ ! -f "$WERKZEUG/normstand_pruefen.py" ]; then
            GRUENDE+=("Prüfwerkzeuge vom Hauptzweig nicht verfügbar – nichts geprüft")
          elif [ -d .bibliothek/.git ] && { ! git -C .bibliothek diff --quiet HEAD -- \
                 || [ -n "$(git -C .bibliothek ls-files --others --exclude-standard -- texte forschung gemeinfrei normen katalog.yml)" ]; }; then
            GRUENDE+=("Fachbibliothek während des Laufs verändert – nichts geprüft")
          else
            # Für die Schlussprüfung geladene Quelltexte (Fachaufsätze; amtliche Seiten nimmt das Werkzeug aus)
            ZUSATZ=()
            while IFS= read -r ordner; do ZUSATZ+=(--zusatz "$ordner"); done \
              < <(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 4 -type d -name quellen 2>/dev/null)
            # Auf stdout und in die Berichte schreiben die Werkzeuge nur Stellen im Entwurf –
            # nie Werk, Seite oder Text aus der Bibliothek. Ihre
            # Fehlerausgabe bleibt im Runner-Temp: Bei einem Absturz könnte sie Text aus der
            # Bibliothek enthalten, und dieses Protokoll ist öffentlich.
            python "$WERKZEUG/wortgleich_pruefen.py" "${ENTWUERFE[@]}" --bibliothek .bibliothek "${ZUSATZ[@]}" \
              --bericht "$ARBEIT/wortgleich.md" > "$ARBEIT/wortgleich.txt" 2> "$ARBEIT/wortgleich.err"
            WORT=$?
            python "$WERKZEUG/normstand_pruefen.py" "${ENTWUERFE[@]}" --ausgaben .bibliothek/normen/ausgaben.yml \
              --bericht "$ARBEIT/normstand.md" > "$ARBEIT/normstand.txt" 2> "$ARBEIT/normstand.err"
            NORM=$?
          fi
          WORT_ZEILE="$(tail -n 1 "$ARBEIT/wortgleich.txt" 2> /dev/null)"
          NORM_ZEILE="$(tail -n 1 "$ARBEIT/normstand.txt" 2> /dev/null)"
          echo "Wörtliche Übernahmen: ${WORT_ZEILE:-keine Ausgabe} (Rückgabewert $WORT)"
          echo "Normstand: ${NORM_ZEILE:-keine Ausgabe} (Rückgabewert $NORM)"
          case "$WORT" in
            0) ;;
            1) GRUENDE+=("wörtliche Übereinstimmung mit der Fachbibliothek oder einer geladenen Quelle – die genannten Stellen in eigene Worte fassen") ;;
            *) GRUENDE+=("Wortgleich-Prüfung nicht möglich (Werkzeug oder Fachbibliothek fehlt oder ist unlesbar, Rückgabewert $WORT)") ;;
          esac
          case "$NORM" in
            0) ;;
            1) GRUENDE+=("genannte Normausgabe passt nicht zum Normenindex der Fachbibliothek – Ausgabe korrigieren oder weglassen") ;;
            *) GRUENDE+=("Normstand-Prüfung nicht möglich (Werkzeug oder Normenindex fehlt oder ist unlesbar, Rückgabewert $NORM)") ;;
          esac
          {
            echo "## Wörtliche Übernahmen und Normstand (automatische Prüfung)"
            echo
            echo "- Wörtliche Übernahmen aus der Fachbibliothek und den geladenen Quellen: \`${WORT_ZEILE:-keine Ausgabe}\`"
            echo "- Normausgaben gegen den Normenindex: \`${NORM_ZEILE:-keine Ausgabe}\`"
            echo "- Geprüft: ${#ENTWUERFE[@]} Datei(en) des Pull Requests, Entwürfe und Vorlagen-Beschreibungen"
            echo
            for bericht in "$ARBEIT/wortgleich.md" "$ARBEIT/normstand.md"; do
              if [ -s "$bericht" ]; then cat "$bericht"; echo; fi
            done
            if [ "${#GRUENDE[@]}" -eq 0 ]; then
              echo "✅ Keine wörtlichen Übernahmen aus der Fachbibliothek oder den geladenen Quellen; die genannten Normausgaben entsprechen dem Normenindex."
            else
              echo "⛔ **Nicht zum Mergen freigegeben** – der Pull Request bleibt ein Entwurf:"
              for grund in "${GRUENDE[@]}"; do echo "- $grund"; done
              echo
              echo "Die Berichte nennen nur Stellen im Entwurf (Datei, Abschnitt, Zeile) – nie Werk, Seite oder Text aus der Bibliothek. Bitte die Stellen auf diesem Zweig in eigene Worte fassen bzw. die Ausgabe korrigieren, mit \`python tools/wortgleich_pruefen.py <Entwurf> --bibliothek <Fachbibliothek>\` und \`python tools/normstand_pruefen.py <Entwurf> --ausgaben <Fachbibliothek>/normen/ausgaben.yml\` erneut prüfen und erst dann auf „Ready for review“ klicken."
            fi
          } > "$KOMMENTAR"
          gh pr comment "$NR" --body-file "$KOMMENTAR" \
            || echo "::warning title=$TITEL::Der Prüfbericht ließ sich nicht in Pull Request #$NR kommentieren."
          {
            echo "## Wörtliche Übernahmen und Normstand"
            echo "- Wortgleich: ${WORT_ZEILE:-keine Ausgabe} · Normstand: ${NORM_ZEILE:-keine Ausgabe}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#GRUENDE[@]}" -eq 0 ]; then
            echo "freigabe=true" >> "$GITHUB_OUTPUT"
          else
            for grund in "${GRUENDE[@]}"; do
              echo "::error title=$TITEL::Pull Request #$NR bleibt ein Entwurf: $grund"
            done
            echo "freigabe=false" >> "$GITHUB_OUTPUT"
          fi

      # Erst jetzt – nach den Prüfungen, ihren Korrekturen und der Prüfung auf
      # wörtliche Übernahmen und Normstand – wird der Pull Request zum
      # Zusammenführen freigegeben, und nur, wenn diese nichts gefunden hat.
      # GitHub benachrichtigt dabei.
      - name: Zum Mergen freigeben
        if: ${{ !cancelled() && steps.ziel.outputs.freigeben != '' && steps.wortlaut.outputs.freigabe == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NR: ${{ steps.ziel.outputs.freigeben }}
          PRUEFUNG: ${{ steps.schluss.outcome }}
        run: |
          set -euo pipefail
          if gh pr ready "$NR" > /dev/null 2>&1; then
            case "$PRUEFUNG" in
              success) gh pr comment "$NR" --body "✅ Fakten- und Schlussprüfung abgeschlossen, Korrekturen sind eingearbeitet – bereit zur Freigabe. Bitte lesen und zusammenführen (oder schließen, wenn der Beitrag nicht erscheinen soll)." ;;
              skipped|"") gh pr comment "$NR" --body "⚠️ Die Schlussprüfung konnte nicht laufen (Entwurf oder Quellen nicht ladbar). Bitte Zahlen, Fußnoten und die Aussagen über die Entscheidung vor dem Merge selbst prüfen." ;;
            esac
            echo "::notice title=Urteilsbesprechung::Pull Request #$NR ist bereit zur Freigabe."
          else
            gh pr comment "$NR" --body "Die Prüfungen sind fertig. Bitte oben auf „Ready for review“ klicken, dann lesen und zusammenführen." || true
            echo "::warning title=Urteilsbesprechung::Pull Request #$NR ließ sich nicht automatisch freigeben – Hinweis im Pull Request."
          fi

      - name: Ergebnis melden
        if: always()
        env:
          GEFUNDEN: ${{ steps.kandidaten.outputs.gefunden }}
          AGENT: ${{ steps.agent.outputs.ergebnis || steps.claude.outcome }}
          BEGINN: ${{ steps.kandidaten.outputs.beginn }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$GEFUNDEN" != "true" ]; then
            echo "::notice title=Urteilsbesprechung::Kein Kandidat – es wurde kein Entwurf erstellt."
            exit 0
          fi

          if [ "$AGENT" != "success" ]; then
            echo "::warning title=Urteilsbesprechung::Der Agent endete mit „${AGENT}\". Falls ein Branch entwurf/* entstanden ist, bitte von Hand prüfen."
            exit 0
          fi

          PR="$(python tools/eigener_entwurf.py --seit "$BEGINN" --format "Rechtsprechung" --fassung "" --ausgabe url 2>/dev/null || echo "")"

          if [ -n "$PR" ]; then
            echo "::notice title=Urteilsbesprechung::Entwurf liegt bereit: $PR"
            echo "- Entwurf: $PR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Urteilsbesprechung::Der Agent meldet Erfolg, es ist aber kein seit ${BEGINN} angelegter Entwurf-Zweig zu finden. Möglicherweise hat er alle Kandidaten verworfen – bitte im Log nachsehen."
          fi

      # -----------------------------------------------------------------
      # Mehrere Runden: Die nächste Runde startet nur, wenn diese einen neuen
      # Entwurf hervorgebracht hat. Sonst (Liste leer, kein passender Fall,
      # Duplikat) würde sie dieselbe vergebliche Suche wiederholen und
      # Kontingent verbrauchen. Der Fehler hier sagt die übrigen Runden ab.
      # -----------------------------------------------------------------
      - name: Weitere Runden nur nach einem neuen Entwurf
        if: success() && matrix.runde < fromJSON(needs.planen.outputs.anzahl)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEGINN: ${{ steps.kandidaten.outputs.beginn }}
          RUNDE: ${{ matrix.runde }}
          ANZAHL: ${{ needs.planen.outputs.anzahl }}
        run: |
          set -euo pipefail
          if [ -z "${BEGINN:-}" ]; then
            echo "::error title=Urteilsbesprechung::Startzeit dieser Runde unbekannt – die übrigen Runden werden sicherheitshalber abgesagt."
            exit 1
          fi
          # Eigene Entwürfe dieser Runde, erkannt am Format im Dateikopf (nicht nur am Zweig):
          # So zählt ein gleichzeitig laufender anderer Agent nicht als Ergebnis dieser Runde.
          neu="$(python tools/eigener_entwurf.py --seit "$BEGINN" --format "Rechtsprechung" --fassung "" --ausgabe anzahl)"
          if [ "${neu:-0}" -eq 0 ]; then
            echo "::error title=Urteilsbesprechung::Runde ${RUNDE} von ${ANZAHL} hat keinen neuen Entwurf erzeugt (nichts Passendes mehr gefunden oder Duplikat). Die übrigen Runden werden abgesagt, damit kein Kontingent verpufft."
            exit 1
          fi
          echo "::notice title=Urteilsbesprechung::Runde ${RUNDE} von ${ANZAHL} fertig – weiter mit der nächsten."
