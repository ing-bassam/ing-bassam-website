# Prüfung eines vorhandenen Entwurfs
#
# Für Entwürfe, die bereits im Ordner entwuerfe/ liegen – etwa nachdem sie von
# Hand gekürzt oder überarbeitet wurden. Neue Beiträge durchlaufen dieselben
# Prüfungen automatisch in den Workflows „Fachartikel-Entwurf“ und
# „Urteilsbesprechung“.
#
#   Faktenprüfung   nur bei Urteilsbesprechungen: jede Aussage über die
#                   Entscheidung gegen den amtlichen Volltext
#                   (tools/volltext_laden.py holt ihn anhand von fundstelle
#                   und aktenzeichen im Frontmatter)
#   Schlussprüfung  bei jedem Entwurf: jede Fußnote gegen den heruntergeladenen
#                   Wortlaut ihrer Quelle (tools/quellen_laden.py), unbelegte
#                   Risikoaussagen, Überschriften, Lektorat
#   Wörtliche Übernahmen und Normstand  immer, ohne KI: Wortfolgen, die
#                   wörtlich in der Fachbibliothek stehen
#                   (tools/wortgleich_pruefen.py), und Normausgaben gegen den
#                   Normenindex (tools/normstand_pruefen.py). Die Berichte
#                   nennen nur Stellen im Entwurf (Datei, Abschnitt, Zeile) –
#                   nie Werk, Seite oder Text aus der Bibliothek.
#
# Die Korrekturen kommen als Pull Request mit den Prüfberichten; am Entwurf
# auf dem Hauptzweig ändert sich nichts, bevor Sie ihn mergen. Meldet die
# Prüfung auf wörtliche Übernahmen etwas oder ist sie nicht möglich
# (Fachbibliothek fehlt), wird nichts gepusht – der Lauf endet mit einem
# Fehler, die Stellen im Entwurf stehen in der Zusammenfassung. Meldet nur die
# Normstand-Prüfung etwas, entsteht der Pull Request als Entwurf (nicht
# mergebar). Berichte der Prüf-Agenten erscheinen nur, wenn sie selbst
# nichts wörtlich aus der Fachbibliothek oder den Quellen enthalten.

name: Entwurf prüfen

on:
  workflow_dispatch:
    inputs:
      entwurf:
        description: "Entwurfsdatei, z. B. entwuerfe/entwurf/2026-09-24-nachbesserung-verweigert-werklohn.md"
        required: true
        type: string
      umfang:
        description: "Welche Prüfungen laufen (die Faktenprüfung nur bei Urteilsbesprechungen)"
        required: false
        default: "beide"
        type: choice
        options:
          - "beide"
          - "nur Schlussprüfung"
          - "nur Faktenprüfung"

run-name: "Entwurf prüfen: ${{ inputs.entwurf }}"

concurrency:
  group: entwurf-pruefen
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    # Faktenprüfung bis 50 Minuten, Schlussprüfung bis 40, dazu Abruf und Abschluss.
    timeout-minutes: 110

    permissions:
      contents: write        # Korrekturzweig pushen
      pull-requests: write   # Pull Request mit den Prüfberichten öffnen
      id-token: write        # von der Claude-Action benötigt

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git-Identität setzen
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null

      - name: Python bereitstellen
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet 'markdown==3.7' 'PyYAML==6.0.2' 'pypdf==6.19.0'

      # -----------------------------------------------------------------
      # Fachbibliothek des Büros: Textauszüge der Fachbücher aus dem privaten
      # Repository FachwissenAgent, mit gedruckten Seitenzahlen und Katalog.
      # Ohne das Secret BIBLIOTHEK_TOKEN oder bei einem Fehler arbeitet der
      # Agent wie bisher ohne Bibliothek; der Lauf bricht deswegen nicht ab.
      # Die Prüfung auf wörtliche Übernahmen meldet dann aber einen Fehler: Sie
      # braucht die Bibliothek (fail-closed).
      # -----------------------------------------------------------------
      - name: Fachbibliothek prüfen
        id: bib
        env:
          # Nur Ja/Nein, nie der Wert selbst.
          TOKEN_DA: ${{ secrets.BIBLIOTHEK_TOKEN != '' }}
        run: |
          echo "vorhanden=$TOKEN_DA" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_DA" != "true" ]; then
            echo "::notice title=Fachbibliothek::Secret BIBLIOTHEK_TOKEN fehlt – der Agent arbeitet ohne Fachbibliothek."
          fi

      - name: Fachbibliothek laden
        id: bibladen
        if: steps.bib.outputs.vorhanden == 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bib-ingenieurbuero/FachwissenAgent
          token: ${{ secrets.BIBLIOTHEK_TOKEN }}
          path: .bibliothek
          # Der Zugangsschlüssel bleibt nicht im Arbeitsverzeichnis liegen,
          # das der Agent lesen kann.
          persist-credentials: false

      - name: Suchindex der Fachbibliothek bauen
        id: bibindex
        if: steps.bibladen.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python tools/bibliothek_suchen.py .bibliothek --index
          echo "ordner=.bibliothek" >> "$GITHUB_OUTPUT"

      - name: Fachbibliothek nicht ladbar
        if: steps.bibladen.outcome == 'failure'
        run: |
          echo "::warning title=Fachbibliothek::Die Fachbibliothek konnte nicht geladen werden. Meist ist der Zugangsschlüssel BIBLIOTHEK_TOKEN abgelaufen – bitte erneuern. Der Agent arbeitet in diesem Lauf ohne Bibliothek."

      - name: Entwurf prüfen und Volltext laden
        id: vorbereitung
        env:
          # Eingaben nie direkt in die Shell schreiben, sondern über die Umgebung.
          ENTWURF: ${{ inputs.entwurf }}
          UMFANG: ${{ inputs.umfang }}
        run: |
          set -euo pipefail
          # Nur Dateien im Entwurfsordner, nur harmlose Zeichen im Namen.
          if ! [[ "$ENTWURF" =~ ^entwuerfe/(entwurf/|veroeffentlicht/)?[a-z0-9-]+\.md$ ]] || [ ! -f "$ENTWURF" ]; then
            echo "::error title=Entwurf prüfen::„$ENTWURF“ ist keine Datei im Ordner entwuerfe/."
            exit 1
          fi
          ARBEIT="$RUNNER_TEMP/pruefung"
          mkdir -p "$ARBEIT"
          : > "$ARBEIT/faktenpruefung.diff"
          KURZ="$(basename "$ENTWURF" .md)"
          ZWEIG="pruefung/${KURZ#????-??-??-}-$(date -u +%Y%m%d%H%M)"
          # Korrekturen landen auf einem eigenen Zweig; gepusht wird erst am Ende.
          git checkout -q -b "$ZWEIG"
          {
            echo "arbeit=$ARBEIT"
            echo "zweig=$ZWEIG"
            echo "start=$(git rev-parse HEAD)"
            echo "diff=$ARBEIT/faktenpruefung.diff"
            echo "faktenbericht=$ARBEIT/faktenpruefung.md"
            echo "schlussbericht=$ARBEIT/schlusspruefung.md"
          } >> "$GITHUB_OUTPUT"

          FAKTEN=false
          SCHLUSS=false
          case "$UMFANG" in
            "nur Schlussprüfung") SCHLUSS=true ;;
            "nur Faktenprüfung")  FAKTEN=true ;;
            *)                    FAKTEN=true; SCHLUSS=true ;;
          esac

          # Die Faktenprüfung braucht eine Urteilsbesprechung mit Fundstelle.
          if [ "$FAKTEN" = true ]; then
            if grep -q '^aktenzeichen:[[:space:]]*[^[:space:]]' "$ENTWURF" \
               && grep -q '^fundstelle:[[:space:]]*[^[:space:]]' "$ENTWURF"; then
              if AUSGABE="$(python tools/volltext_laden.py "$ENTWURF" "$ARBEIT/volltexte")"; then
                printf '%s\n' "$AUSGABE"
                echo "volltext=$(printf '%s\n' "$AUSGABE" | tail -n 1)" >> "$GITHUB_OUTPUT"
              else
                echo "::warning title=Faktenprüfung::Volltext nicht abrufbar, die Faktenprüfung entfällt: $AUSGABE"
                FAKTEN=false
              fi
            else
              echo "::notice title=Faktenprüfung::Keine Urteilsbesprechung – die Faktenprüfung entfällt."
              FAKTEN=false
            fi
          fi
          if [ "$FAKTEN" = false ] && [ "$SCHLUSS" = false ]; then
            echo "::warning title=Entwurf prüfen::Für diesen Entwurf und diese Auswahl ist keine Prüfung möglich."
          fi
          echo "fakten=$FAKTEN" >> "$GITHUB_OUTPUT"
          echo "schluss=$SCHLUSS" >> "$GITHUB_OUTPUT"

      - name: Fakten gegen den Volltext prüfen
        id: fakten
        if: steps.vorbereitung.outputs.fakten == 'true'
        continue-on-error: true
        timeout-minutes: 50
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /faktenpruefung
            Entwurf: ${{ inputs.entwurf }}
            Volltext: ${{ steps.vorbereitung.outputs.volltext }}
            Bericht: ${{ steps.vorbereitung.outputs.faktenbericht }}
          claude_args: |
            --max-turns 110
            --model claude-opus-5-5
            --add-dir ${{ steps.vorbereitung.outputs.arbeit }}
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Skill,Bash(python tools/artikel_generator.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/wortgleich_pruefen.py:*),Bash(python tools/normstand_pruefen.py:*),Bash(wc:*)"

      - name: Ergebnis der Faktenprüfung festhalten
        if: ${{ !cancelled() && steps.vorbereitung.outputs.fakten == 'true' }}
        env:
          ENTWURF: ${{ inputs.entwurf }}
          DIFF: ${{ steps.vorbereitung.outputs.diff }}
        run: |
          set -euo pipefail
          # Die Schlussprüfung prüft jede Änderung der Faktenprüfung noch einmal.
          git diff -U0 -- "$ENTWURF" > "$DIFF" || true
          python tools/artikel_generator.py > /dev/null || true
          if ! git diff --quiet -- entwuerfe fachwissen sitemap.xml; then
            git add entwuerfe fachwissen sitemap.xml
            git commit -q -m "Faktenpruefung: $(basename "$ENTWURF" .md)" \
                          -m "Korrekturen gegen den amtlichen Volltext. Einzelheiten im Pull Request."
          fi

      - name: Quellen für die Schlussprüfung laden
        id: quellen
        if: ${{ !cancelled() && steps.vorbereitung.outputs.schluss == 'true' }}
        env:
          ENTWURF: ${{ inputs.entwurf }}
          VOLLTEXT: ${{ steps.vorbereitung.outputs.volltext }}
          ARBEIT: ${{ steps.vorbereitung.outputs.arbeit }}
        run: |
          set -euo pipefail
          VT=()
          if [ -n "$VOLLTEXT" ] && [ -f "$VOLLTEXT" ]; then
            VT=(--volltext "$VOLLTEXT")
          fi
          if [ -f .bibliothek/katalog.yml ]; then VT+=(--bibliothek .bibliothek); fi
          if ! AUSGABE="$(python tools/quellen_laden.py "$ENTWURF" "$ARBEIT/schlusspruefung" "${VT[@]}")"; then
            echo "::warning title=Schlussprüfung::Quellen nicht ladbar – $(printf '%s\n' "$AUSGABE" | tail -n 1)"
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$AUSGABE"
          echo "pruefliste=$(printf '%s\n' "$AUSGABE" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "bereit=true" >> "$GITHUB_OUTPUT"

      - name: Schlussprüfung gegen die Quellen
        id: schluss
        if: ${{ !cancelled() && steps.quellen.outputs.bereit == 'true' }}
        continue-on-error: true
        timeout-minutes: 40
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /schlusspruefung
            Entwurf: ${{ inputs.entwurf }}
            Prüfliste: ${{ steps.quellen.outputs.pruefliste }}
            Volltext: ${{ steps.vorbereitung.outputs.volltext }}
            Änderungen der Faktenprüfung: ${{ steps.vorbereitung.outputs.diff }}
            Bericht: ${{ steps.vorbereitung.outputs.schlussbericht }}
            Bibliothek: ${{ steps.bibindex.outputs.ordner || 'nicht verfügbar' }}
          claude_args: |
            --max-turns 80
            --model claude-opus-5-5
            --add-dir ${{ steps.vorbereitung.outputs.arbeit }}
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Skill,WebFetch,WebSearch,Bash(python tools/artikel_generator.py:*),Bash(python tools/fussnoten_ordnen.py:*),Bash(python tools/bibliothek_suchen.py:*),Bash(python tools/wortgleich_pruefen.py:*),Bash(python tools/normstand_pruefen.py:*),Bash(wc:*)"

      # Prüfwerkzeuge und Freigabeliste immer vom Hauptzweig, nie aus dem
      # Arbeitsstand der Prüf-Agenten: Dort könnte tools/wortgleich_pruefen.py
      # oder tools/wortgleich_erlaubt.txt geändert sein (fail-closed).
      - name: Prüfwerkzeuge vom Hauptzweig holen
        id: werkzeug
        if: always() && steps.vorbereitung.outcome == 'success'
        run: |
          set -uo pipefail
          ZIEL="$RUNNER_TEMP/pruefwerkzeug"
          rm -rf "$ZIEL"
          mkdir -p "$ZIEL"
          if ! git fetch -q --no-tags --depth=1 origin main; then
            echo "::warning title=Prüfwerkzeuge::Hauptzweig nicht ladbar – wörtliche Übernahmen und Normstand bleiben ungeprüft."
            exit 0
          fi
          for datei in wortgleich_pruefen.py wortgleich_erlaubt.txt normstand_pruefen.py bibliothek_suchen.py; do
            if ! git show "FETCH_HEAD:tools/$datei" > "$ZIEL/$datei"; then
              echo "::warning title=Prüfwerkzeuge::tools/$datei fehlt auf dem Hauptzweig – wörtliche Übernahmen und Normstand bleiben ungeprüft."
              exit 0
            fi
          done
          echo "ordner=$ZIEL" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Wörtliche Übernahmen und Normstand – ohne KI, auf dem Stand nach
      # Fakten- und Schlussprüfung, auch gegen die für die Schlussprüfung
      # geladenen Quelltexte. Die Berichte (nur Datei, Abschnitt, Zeile und
      # Länge – nie Werk, Seite oder Text aus der Bibliothek) liegen im
      # Runner-Temp und kommen im nächsten Schritt in den Text des Pull
      # Requests. Fail-closed:
      # Treffer oder eine nicht mögliche Prüfung gelten als Befund; mit
      # wörtlicher Übereinstimmung wird gar nichts gepusht.
      # -----------------------------------------------------------------
      - name: Wörtliche Übernahmen und Normstand prüfen (ohne KI)
        id: wortlaut
        if: always() && steps.vorbereitung.outcome == 'success'
        env:
          ENTWURF: ${{ inputs.entwurf }}
          ARBEIT: ${{ steps.vorbereitung.outputs.arbeit }}
          WERKZEUG: ${{ steps.werkzeug.outputs.ordner }}
        run: |
          set -uo pipefail
          # GitHub startet run-Schritte mit „bash -e“. Rückgabewert 1 (Befund) oder 2 (nicht
          # geprüft) der Werkzeuge würde den Schritt sonst ohne Bericht abbrechen. Jeder
          # Rückgabewert wird ausdrücklich ausgewertet.
          set +e
          BERICHT="$ARBEIT/wortlaut.md"
          GRUENDE=()
          WORT=2
          NORM=2
          if [ -z "${WERKZEUG:-}" ] || [ ! -f "$WERKZEUG/wortgleich_pruefen.py" ] || [ ! -f "$WERKZEUG/normstand_pruefen.py" ]; then
            GRUENDE+=("Prüfwerkzeuge vom Hauptzweig nicht verfügbar – nichts geprüft")
          elif [ -d .bibliothek/.git ] && { ! git -C .bibliothek diff --quiet HEAD -- \
                 || [ -n "$(git -C .bibliothek ls-files --others --exclude-standard -- texte forschung gemeinfrei normen katalog.yml)" ]; }; then
            GRUENDE+=("Fachbibliothek während des Laufs verändert – nichts geprüft")
          else
            ZUSATZ=()
            while IFS= read -r ordner; do ZUSATZ+=(--zusatz "$ordner"); done \
              < <(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 4 -type d -name quellen 2>/dev/null)
            # Fehlerausgabe nur ins Runner-Temp: Bei einem Absturz könnte sie Text aus der
            # Bibliothek enthalten, und dieses Protokoll ist öffentlich.
            python "$WERKZEUG/wortgleich_pruefen.py" "$ENTWURF" --bibliothek .bibliothek "${ZUSATZ[@]}" \
              --bericht "$ARBEIT/wortgleich.md" > "$ARBEIT/wortgleich.txt" 2> "$ARBEIT/wortgleich.err"
            WORT=$?
            python "$WERKZEUG/normstand_pruefen.py" "$ENTWURF" --ausgaben .bibliothek/normen/ausgaben.yml \
              --bericht "$ARBEIT/normstand.md" > "$ARBEIT/normstand.txt" 2> "$ARBEIT/normstand.err"
            NORM=$?
          fi
          WORT_ZEILE="$(tail -n 1 "$ARBEIT/wortgleich.txt" 2> /dev/null)"
          NORM_ZEILE="$(tail -n 1 "$ARBEIT/normstand.txt" 2> /dev/null)"
          echo "Wörtliche Übernahmen: ${WORT_ZEILE:-keine Ausgabe} (Rückgabewert $WORT)"
          echo "Normstand: ${NORM_ZEILE:-keine Ausgabe} (Rückgabewert $NORM)"
          echo "wortgleich=$WORT" >> "$GITHUB_OUTPUT"
          case "$WORT" in
            0) ;;
            1) GRUENDE+=("wörtliche Übereinstimmung mit der Fachbibliothek oder einer geladenen Quelle – die genannten Stellen in eigene Worte fassen") ;;
            *) GRUENDE+=("Wortgleich-Prüfung nicht möglich (Werkzeug oder Fachbibliothek fehlt oder ist unlesbar, Rückgabewert $WORT)") ;;
          esac
          case "$NORM" in
            0) ;;
            1) GRUENDE+=("genannte Normausgabe passt nicht zum Normenindex der Fachbibliothek – Ausgabe korrigieren oder weglassen") ;;
            *) GRUENDE+=("Normstand-Prüfung nicht möglich (Werkzeug oder Normenindex fehlt oder ist unlesbar, Rückgabewert $NORM)") ;;
          esac
          {
            echo "## Wörtliche Übernahmen und Normstand (automatische Prüfung)"
            echo
            echo "- Wörtliche Übernahmen aus der Fachbibliothek und den geladenen Quellen: \`${WORT_ZEILE:-keine Ausgabe}\`"
            echo "- Normausgaben gegen den Normenindex: \`${NORM_ZEILE:-keine Ausgabe}\`"
            echo
            for teil in "$ARBEIT/wortgleich.md" "$ARBEIT/normstand.md"; do
              if [ -s "$teil" ]; then cat "$teil"; echo; fi
            done
            if [ "${#GRUENDE[@]}" -eq 0 ]; then
              echo "✅ Keine wörtlichen Übernahmen aus der Fachbibliothek oder den geladenen Quellen; die genannten Normausgaben entsprechen dem Normenindex."
            else
              echo "⛔ **Befund – vor dem Merge beheben:**"
              for grund in "${GRUENDE[@]}"; do echo "- $grund"; done
            fi
          } > "$BERICHT"
          echo "bericht=$BERICHT" >> "$GITHUB_OUTPUT"
          if [ "${#GRUENDE[@]}" -eq 0 ]; then
            echo "sauber=true" >> "$GITHUB_OUTPUT"
          else
            echo "sauber=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${GRUENDE[@]}" > "$ARBEIT/wortlaut-gruende.txt"
            echo "gruende=$ARBEIT/wortlaut-gruende.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Korrekturen als Pull Request vorlegen
        if: always() && steps.vorbereitung.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENTWURF: ${{ inputs.entwurf }}
          ZWEIG: ${{ steps.vorbereitung.outputs.zweig }}
          START: ${{ steps.vorbereitung.outputs.start }}
          ARBEIT: ${{ steps.vorbereitung.outputs.arbeit }}
          FAKTENBERICHT: ${{ steps.vorbereitung.outputs.faktenbericht }}
          SCHLUSSBERICHT: ${{ steps.vorbereitung.outputs.schlussbericht }}
          FAKTEN: ${{ steps.fakten.outcome }}
          SCHLUSS: ${{ steps.schluss.outcome }}
          WORTLAUTBERICHT: ${{ steps.wortlaut.outputs.bericht }}
          WORTLAUT_SAUBER: ${{ steps.wortlaut.outputs.sauber }}
          WORTLAUT_GRUENDE: ${{ steps.wortlaut.outputs.gruende }}
          WORTGLEICH: ${{ steps.wortlaut.outputs.wortgleich }}
          WERKZEUG: ${{ steps.werkzeug.outputs.ordner }}
        run: |
          set -euo pipefail
          # Was in den öffentlichen Pull Request oder die Zusammenfassung geht, wird vorher auf
          # wörtliche Übernahmen geprüft (Werkzeug vom Hauptzweig, Fachbibliothek und geladene
          # Quelltexte). Rückgabewert 0 nur ohne Treffer; ohne Werkzeug oder Bibliothek nicht 0.
          wortgleich_frei() {
            local zusatz=() ordner
            if [ -z "${WERKZEUG:-}" ] || [ ! -f "$WERKZEUG/wortgleich_pruefen.py" ]; then return 2; fi
            if [ -d .bibliothek/.git ] && { ! git -C .bibliothek diff --quiet HEAD -- \
                 || [ -n "$(git -C .bibliothek ls-files --others --exclude-standard -- texte forschung gemeinfrei normen katalog.yml)" ]; }; then
              return 2
            fi
            while IFS= read -r ordner; do zusatz+=(--zusatz "$ordner"); done \
              < <(find "$RUNNER_TEMP" -mindepth 1 -maxdepth 4 -type d -name quellen 2> /dev/null)
            python "$WERKZEUG/wortgleich_pruefen.py" "$@" --bibliothek .bibliothek "${zusatz[@]}" > /dev/null 2>&1
          }
          python tools/artikel_generator.py > /dev/null || true
          if ! git diff --quiet -- entwuerfe fachwissen sitemap.xml; then
            git add entwuerfe fachwissen sitemap.xml
            git commit -q -m "Schlusspruefung: $(basename "$ENTWURF" .md)" \
                          -m "Korrekturen gegen die Quellen. Einzelheiten im Pull Request."
          fi

          TEXT="$ARBEIT/pr-body.md"
          : > "$TEXT"
          for bericht in "$FAKTENBERICHT" "$SCHLUSSBERICHT"; do
            if [ -s "$bericht" ]; then
              cat "$bericht" >> "$TEXT"
              printf '\n\n' >> "$TEXT"
            fi
          done
          if [ ! -s "$TEXT" ]; then
            printf '⚠️ Keine Prüfung hat einen Bericht geschrieben (Faktenprüfung: %s, Schlussprüfung: %s). Die Korrekturen im Diff sind möglicherweise unvollständig; bitte vor dem Merge selbst gegenlesen.\n\n' \
              "${FAKTEN:-übersprungen}" "${SCHLUSS:-übersprungen}" > "$TEXT"
          elif ! wortgleich_frei "$TEXT"; then
            # Die Berichte der Prüf-Agenten zitieren Entwurf und Quellen – mit wörtlicher
            # Übereinstimmung (oder ohne mögliche Prüfung) bleiben sie im Runner.
            printf '⚠️ Die Berichte der Fakten- und Schlussprüfung erscheinen hier nicht: Sie stimmen stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder diese Prüfung war nicht möglich. Bitte die Aussagen vor dem Merge selbst prüfen.\n\n' > "$TEXT"
          fi
          # Bericht der Prüfung auf wörtliche Übernahmen und Normstand (nur Stellen im Entwurf,
          # nie Werk oder Seite).
          if [ -n "${WORTLAUTBERICHT:-}" ] && [ -s "$WORTLAUTBERICHT" ]; then
            cat "$WORTLAUTBERICHT" >> "$TEXT"
            printf '\n\n' >> "$TEXT"
          fi

          # Fail-closed: Fehlt das Ergebnis, gilt die Prüfung als nicht möglich.
          BEFUND=false
          if [ "${WORTLAUT_SAUBER:-}" != "true" ]; then
            BEFUND=true
            if [ -n "${WORTLAUT_GRUENDE:-}" ] && [ -s "$WORTLAUT_GRUENDE" ]; then
              while IFS= read -r grund; do
                echo "::error title=Entwurf prüfen::$grund"
              done < "$WORTLAUT_GRUENDE"
            else
              echo "::error title=Entwurf prüfen::Die Prüfung auf wörtliche Übernahmen und Normstand hat kein Ergebnis geliefert."
            fi
          fi

          if [ "$(git rev-list --count "$START"..HEAD)" = "0" ]; then
            {
              echo "## Keine Korrekturen der Prüf-Agenten"
              echo
              cat "$TEXT"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$BEFUND" = true ]; then
              # Nichts zum Committen – der Befund darf trotzdem nicht still in der Zusammenfassung landen.
              echo "::error title=Entwurf prüfen::Wörtliche Übernahmen oder Normstand: Befund ohne Korrektur-Commit – die Stellen bitte von Hand in eigene Worte fassen bzw. die Ausgabe korrigieren (Bericht in der Zusammenfassung dieses Laufs)."
              exit 1
            fi
            echo "::notice title=Entwurf prüfen::Keine Korrekturen – kein Pull Request nötig. Die Berichte stehen in der Zusammenfassung dieses Laufs."
            exit 0
          fi
          if [ "${WORTGLEICH:-}" != "0" ]; then
            # Wörtliche Übereinstimmung oder nicht geprüft: Der korrigierte Stand kommt nicht in
            # den öffentlichen Zweig. Die Stellen im Entwurf stehen in der Zusammenfassung.
            {
              echo "## Korrekturen nicht vorgelegt"
              echo
              cat "$TEXT"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Entwurf prüfen::Kein Pull Request: Der korrigierte Entwurf stimmt stellenweise wörtlich mit der Fachbibliothek oder einer geladenen Quelle überein, oder diese Prüfung war nicht möglich (Stellen im Entwurf in der Zusammenfassung dieses Laufs)."
            exit 1
          fi
          git push -q -u origin "$ZWEIG"
          # Mit Befund entsteht der Pull Request als Entwurf: So lässt er sich nicht mergen.
          ENTWURFSMODUS=()
          if [ "$BEFUND" = true ]; then ENTWURFSMODUS=(--draft); fi
          gh pr create --base main --head "$ZWEIG" "${ENTWURFSMODUS[@]}" \
            --title "Pruefung: $(basename "$ENTWURF" .md)" \
            --body-file "$TEXT"
          if [ "$BEFUND" = true ]; then
            echo "::error title=Entwurf prüfen::Pull Request als Entwurf angelegt: Befund bei wörtlichen Übernahmen oder Normstand – Einzelheiten im Pull Request."
            exit 1
          fi
